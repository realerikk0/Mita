# Compatibility boundary: this published Flatpak app ID must stay stable so
# existing uk.jingxing.Mita installations receive Biyan updates.
id: uk.jingxing.Mita
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: Biyan
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window on X11
  - --device=dri # GPU rendering only; Biyan does not run local model compute
  - --share=ipc
  - --share=network
  - --socket=pulseaudio # for future multimodality
  - --env=LD_LIBRARY_PATH=/app/lib:/usr/lib/extensions/vulkan/nvidia/lib

add-extensions:
  org.freedesktop.Platform.GL:
    directory: lib/GL
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;lib
    subdirectories: true
    no-autodownload: true
    autodelete: false

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig

modules:
  - name: biyan-binary
    buildsystem: simple
    sources:
      - type: file
        # Keep the legacy CDN route until the publisher migrates it; the
        # release artifact itself is Biyan-branded.
        url: https://updates.jingxing.uk/mita/flatpak/Biyan_0.0.0_amd64.deb
        sha256: de852b052cf85007f8ac9728c0607926af2c1d7375ee1652d31d5e91be4a6283
        only-arches: [x86_64]
      - type: file
        path: uk.jingxing.Mita.metainfo.xml
    build-commands:
      - ar -x *.deb
      - tar -xf data.tar.gz
      - 'install -Dm755 usr/bin/Biyan /app/bin/Biyan'
      - 'install -Dm755 usr/bin/bun /app/bin/bun'
      - 'install -Dm755 usr/bin/uv /app/bin/uv'
      - cp -rv usr/lib/* /app/lib/.
      # Desktop, icon, and metainfo destinations intentionally retain the
      # published Flatpak ID; their visible names and executable use Biyan.
      - install -Dm644 usr/share/applications/Biyan.desktop /app/share/applications/uk.jingxing.Mita.desktop
      - desktop-file-edit --set-key=Exec --set-value=/app/bin/Biyan --set-icon=uk.jingxing.Mita /app/share/applications/uk.jingxing.Mita.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/Biyan.png /app/share/icons/hicolor/128x128/apps/uk.jingxing.Mita.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/Biyan.png /app/share/icons/hicolor/32x32/apps/uk.jingxing.Mita.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/Biyan.png /app/share/icons/hicolor/256x256@2/apps/uk.jingxing.Mita.png
      - install -Dm644 uk.jingxing.Mita.metainfo.xml /app/share/metainfo/uk.jingxing.Mita.metainfo.xml
      - mkdir -p /app/lib/GL
