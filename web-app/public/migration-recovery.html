<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biyan 数据迁移恢复</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111318; color: #f5f7fb; }
      main { width: min(560px, calc(100vw - 48px)); padding: 32px; border: 1px solid #303542; border-radius: 20px; background: #1a1e27; box-shadow: 0 18px 70px #0008; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { color: #b7becc; line-height: 1.65; }
      .actions { display: grid; gap: 10px; margin-top: 24px; }
      button, a { box-sizing: border-box; width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #41495a; background: #242a36; color: inherit; text-align: center; text-decoration: none; cursor: pointer; font: inherit; }
      button.primary { border-color: #7895ff; background: #4c69d8; }
      #status { min-height: 24px; color: #ffbd70; font-size: 14px; }
      #sources { margin: 12px 0 0; padding-left: 20px; color: #b7becc; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">正在安全升级 Biyan 数据</h1>
      <p id="description">正在复制、校验并切换数据。完成前不会启动聊天、API 或 MCP 服务，请勿关闭应用。</p>
      <div id="source-section" hidden>
        <p>检测到以下旧数据目录（仅按固定优先级选择第一项，不会自动合并）：</p>
        <ul id="sources"></ul>
      </div>
      <div class="actions" id="actions" hidden>
        <button class="primary" id="retry" type="button">重试迁移并重启</button>
        <button id="logs" type="button">查看迁移日志</button>
        <button id="legacy" type="button">打开旧数据目录</button>
        <a href="mailto:help@biyan.ai">发送邮件至 help@biyan.ai</a>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/migration-recovery.js"></script>
  </body>
</html>
