name: Biyan Updater Health Gate

on:
  repository_dispatch:
    types: [biyan-updater-health]
  workflow_dispatch:
    inputs:
      expected_current:
        description: "Logical current version used for policy CAS"
        required: true
        type: string
      evidence_url:
        description: "HTTPS rollout-health.json URL"
        required: true
        type: string
      evidence_sha256:
        description: "SHA-256 of rollout-health.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: biyan-stable-updater-promotion
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate health and atomically pause every updater entrypoint
    if: github.ref == 'refs/heads/mita-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release-distribution
    env:
      AWS_DEFAULT_REGION: auto
      ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
      POLICY_KEY: biyan/updater/stable/policy.json
      OPEN_TRANSACTION_KEY: biyan/updater/transactions/open.json
      DYNAMIC_UPDATER_BASE_URL: https://updates.mita.so/biyan/v1/stable
      LEGACY_ALIYUN_KEY: mita/latest.json
      LEGACY_R2_KEY: mita/latest.json
      LEGACY_ALIYUN_URL: https://static.mitapp.cn/mita/latest.json
      LEGACY_R2_URL: https://updates.mita.so/mita/latest.json
      EXPECTED_CURRENT: ${{ github.event.client_payload.expected_current || inputs.expected_current }}
      EVIDENCE_URL: ${{ github.event.client_payload.evidence_url || inputs.evidence_url }}
      EVIDENCE_SHA256: ${{ github.event.client_payload.evidence_sha256 || inputs.evidence_sha256 }}
    steps:
      - name: Check out trusted policy writer
        uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact live trusted control plane
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse refs/remotes/origin/mita-main)"

      - name: Evaluate fail-closed health thresholds
        id: health
        run: |
          set -euo pipefail
          mkdir -p dist/health
          node scripts/updater/promotion-transaction.mjs \
            validate-health-evidence-url --url "$EVIDENCE_URL" \
            --sha256 "$EVIDENCE_SHA256" \
            --output dist/health/trusted-health-evidence-url.json
          curl --proto '=https' --tlsv1.2 -fsS --retry 5 \
            "$EVIDENCE_URL" -o dist/health/rollout-health.json
          node scripts/updater/evaluate-rollout-health.mjs \
            dist/health/rollout-health.json "$EVIDENCE_SHA256" \
            dist/health/decision.json
          pause="$(jq -er '.pause | if . then "true" else "false" end' \
            dist/health/decision.json)"
          printf 'pause=%s\n' "$pause" >>"$GITHUB_OUTPUT"
          if [[ "$pause" != true ]]; then
            echo "Health gate is clear; automatic resume remains forbidden."
          fi

      - name: Install pinned production store and CDN clients
        if: steps.health.outputs.pause == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-3.3.22-amd64.tgz \
            -o dist/tools/aliyun-cli.tgz
          echo "41a67dfd2f44c00eb628d9f91fa7c4807222de54ebe44fac3477fb9c70b3b0bc  dist/tools/aliyun-cli.tgz" \
            | sha256sum --check -
          tar -xzf dist/tools/aliyun-cli.tgz -C dist/tools
          sudo install -m 0755 dist/tools/aliyun /usr/local/bin/aliyun
          aliyun version | tee dist/tools/aliyun-version.txt
          grep -Eq '(^|[^0-9])3\.3\.22([^0-9]|$)' \
            dist/tools/aliyun-version.txt

          curl --proto '=https' --tlsv1.2 -fsSL \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            -o dist/tools/ossutil.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  dist/tools/ossutil.zip" \
            | sha256sum --check -
          unzip -q dist/tools/ossutil.zip -d dist/tools
          sudo install -m 0755 \
            dist/tools/ossutil-2.3.0-linux-amd64/ossutil \
            /usr/local/bin/ossutil
          ossutil version | tee dist/tools/ossutil-version.txt
          grep -Eq '(^|[^0-9])2\.3\.0([^0-9]|$)' \
            dist/tools/ossutil-version.txt

      - name: Pause Router and legacy origins when a threshold is breached
        if: steps.health.outputs.pause == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET || vars.ALIYUN_OSS_BUCKET || 'mita-static' }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          aliyun configure set \
            --profile release \
            --mode AK \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          bash scripts/updater/run-pause-transaction.sh

      - name: Upload health decision and transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/health/
            dist/pause/
            dist/tools/*-version.txt
          if-no-files-found: error
          retention-days: 30
