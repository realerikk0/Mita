name: Release Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to distribute, for example v0.6.605"
        required: true
        type: string
      dry_run:
        description: "Render and validate only; do not upload to Baidu or send Feishu"
        required: true
        default: true
        type: boolean
      probe_only:
        description: "Upload a tiny Baidu probe file only; skip GitHub release packages and Feishu"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-distribution-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  BAIDUPCS_VERSION: ${{ vars.BAIDUPCS_VERSION || 'v4.0.1' }}
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  distribute:
    name: Upload release assets and notify Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-distribution
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            dry_run="false"
            probe_only="false"
          else
            tag="${{ inputs.tag }}"
            dry_run="${{ inputs.dry_run }}"
            probe_only="${{ inputs.probe_only }}"
          fi

          if [ -z "$tag" ]; then
            echo "Release tag is required" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "dry_run=$dry_run"
            echo "probe_only=$probe_only"
          } >> "$GITHUB_OUTPUT"
          echo "Distributing release $tag (dry_run=$dry_run)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch release metadata
        if: steps.release.outputs.probe_only != 'true'
        shell: bash
        run: |
          mkdir -p dist/release-assets
          gh release view "${{ steps.release.outputs.tag }}" \
            --json tagName,name,url,publishedAt,body,assets \
            > dist/release.json

      - name: Download release packages
        if: steps.release.outputs.probe_only != 'true'
        shell: bash
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --dir dist/release-assets \
            --pattern "*.dmg" \
            --pattern "*.exe" \
            --pattern "*.msi" \
            --clobber
          find dist/release-assets -maxdepth 1 -type f -print | sort

      - name: Collect and validate release assets
        if: steps.release.outputs.probe_only != 'true'
        shell: bash
        run: |
          node scripts/release-distribution/collect-release-assets.mjs \
            --release-json dist/release.json \
            --assets-dir dist/release-assets \
            --output dist/release-assets.json

      - name: Generate release poster
        if: steps.release.outputs.probe_only != 'true'
        shell: bash
        env:
          JINGXING_API_KEY: ${{ secrets.JINGXING_API_KEY }}
          JINGXING_BASE_URL: ${{ vars.JINGXING_BASE_URL || 'https://api.jingxing.io/v1' }}
          RELEASE_POSTER_ENABLED: ${{ vars.RELEASE_POSTER_ENABLED || 'true' }}
          RELEASE_POSTER_STRICT: ${{ vars.RELEASE_POSTER_STRICT || 'false' }}
        run: |
          node scripts/release-distribution/generate-release-poster.mjs \
            --release-json dist/release-assets.json \
            --output dist/release-poster.png \
            --metadata dist/release-poster.json

      - name: Create Baidu credential probe payload
        if: steps.release.outputs.probe_only == 'true'
        shell: bash
        run: |
          mkdir -p dist/release-assets
          probe_name="mita-baidu-probe-${GITHUB_RUN_ID}.txt"
          probe_path="dist/release-assets/${probe_name}"
          printf 'Mita Baidu credential probe\nrun=%s\ntime=%s\n' \
            "${GITHUB_RUN_ID}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$probe_path"

          node <<'NODE'
          const fs = require('node:fs')

          const probeName = process.env.PROBE_NAME
          const probeTag = process.env.PROBE_TAG
          const manifest = {
            tagName: probeTag,
            name: probeTag,
            url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            publishedAt: new Date().toISOString(),
            assets: {
              probe: {
                name: probeName,
                downloadUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                size: fs.statSync(`dist/release-assets/${probeName}`).size,
                contentType: 'text/plain',
              },
            },
            allAssets: [],
          }

          fs.writeFileSync('dist/release-assets.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        env:
          PROBE_NAME: mita-baidu-probe-${{ github.run_id }}.txt
          PROBE_TAG: baidu-probe-${{ github.run_id }}

      - name: Install BaiduPCS-Go
        if: steps.release.outputs.dry_run != 'true'
        shell: bash
        run: |
          version="${BAIDUPCS_VERSION}"
          archive="BaiduPCS-Go-${version}-linux-amd64.zip"
          curl -fsSLO "https://github.com/qjfoidnh/BaiduPCS-Go/releases/download/${BAIDUPCS_VERSION}/${archive}"
          unzip -q "$archive"
          chmod +x "BaiduPCS-Go-${version}-linux-amd64/BaiduPCS-Go"
          echo "$PWD/BaiduPCS-Go-${version}-linux-amd64" >> "$GITHUB_PATH"

      - name: Upload assets to Baidu Netdisk
        shell: bash
        env:
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          RELEASE_ASSETS_JSON: dist/release-assets.json
          RELEASE_ASSETS_DIR: dist/release-assets
          BAIDU_SHARE_JSON: dist/baidu-share.json
          BAIDU_REMOTE_ROOT: ${{ vars.BAIDU_REMOTE_ROOT || '/Mita/releases' }}
          BAIDU_SHARE_PASSWORD: ${{ secrets.BAIDU_SHARE_PASSWORD || 'mita' }}
          BAIDU_UPLOAD_RAW_ASSETS: "false"
          BAIDU_ALLOW_GITHUB_FALLBACK: "true"
          BAIDUPCS_GO_COOKIES: ${{ secrets.BAIDUPCS_GO_COOKIES }}
          BAIDUPCS_GO_BDUSS: ${{ secrets.BAIDUPCS_GO_BDUSS }}
          BAIDUPCS_GO_STOKEN: ${{ secrets.BAIDUPCS_GO_STOKEN }}
          BAIDUPCS_GO_PTOKEN: ${{ secrets.BAIDUPCS_GO_PTOKEN }}
        run: bash scripts/release-distribution/upload-baidu.sh

      - name: Ensure AWS CLI for Cloudflare R2
        if: steps.release.outputs.dry_run != 'true' && steps.release.outputs.probe_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi

          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aws" --version

      - name: Publish Baidu download manifest to Cloudflare R2
        if: steps.release.outputs.dry_run != 'true' && steps.release.outputs.probe_only != 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPDATES_CDN_BASE_URL: ${{ vars.UPDATES_CDN_BASE_URL || 'https://updates.mita.so' }}
          MITA_DOWNLOAD_MANIFEST_KEY: ${{ vars.MITA_DOWNLOAD_MANIFEST_KEY || 'mita/download/latest.json' }}
          MITA_DOWNLOAD_PAGE_KEY: ${{ vars.MITA_DOWNLOAD_PAGE_KEY || 'mita/download' }}
          MITA_DOWNLOAD_VERSION_ROOT: ${{ vars.MITA_DOWNLOAD_VERSION_ROOT || 'mita/download/releases' }}
        run: |
          set -euo pipefail

          required=(
            CLOUDFLARE_R2_ACCOUNT_ID
            CLOUDFLARE_R2_BUCKET
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for publishing the Mita download manifest" >&2
              exit 1
            fi
          done

          node scripts/release-distribution/build-download-manifest.mjs \
            --release-json dist/release-assets.json \
            --baidu-json dist/baidu-share.json \
            --manifest-output dist/mita-download/latest.json \
            --page-output dist/mita-download/index.html

          endpoint="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          manifest_key="${MITA_DOWNLOAD_MANIFEST_KEY#/}"
          page_key="${MITA_DOWNLOAD_PAGE_KEY#/}"
          version_root="${MITA_DOWNLOAD_VERSION_ROOT%/}/${{ steps.release.outputs.tag }}"
          manifest_cache="public, max-age=60, must-revalidate"
          page_cache="public, max-age=60, must-revalidate"
          immutable_cache="public, max-age=31536000, immutable"

          aws s3 cp dist/mita-download/latest.json "s3://${CLOUDFLARE_R2_BUCKET}/${manifest_key}" \
            --endpoint-url "$endpoint" \
            --cache-control "$manifest_cache" \
            --content-type "application/json"
          aws s3 cp dist/mita-download/index.html "s3://${CLOUDFLARE_R2_BUCKET}/${page_key}" \
            --endpoint-url "$endpoint" \
            --cache-control "$page_cache" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/mita-download/latest.json "s3://${CLOUDFLARE_R2_BUCKET}/${version_root}/download.json" \
            --endpoint-url "$endpoint" \
            --cache-control "$immutable_cache" \
            --content-type "application/json"
          aws s3 cp dist/mita-download/index.html "s3://${CLOUDFLARE_R2_BUCKET}/${version_root}/index.html" \
            --endpoint-url "$endpoint" \
            --cache-control "$immutable_cache" \
            --content-type "text/html; charset=utf-8"

          cdn_base="${UPDATES_CDN_BASE_URL%/}"
          echo "Published Mita Baidu manifest: ${cdn_base}/${manifest_key}"
          echo "Published Mita Baidu download page: ${cdn_base}/${page_key}"

          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skipping cache purge because CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN is not configured"
            exit 0
          fi

          node -e "console.log(JSON.stringify({ files: process.argv.slice(1) }))" \
            "${cdn_base}/${manifest_key}" \
            "${cdn_base}/${page_key}" \
            > dist/mita-download/purge-cache.json
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @dist/mita-download/purge-cache.json

      - name: Send Feishu release messages
        if: steps.release.outputs.probe_only != 'true'
        shell: bash
        env:
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          RELEASE_ASSETS_JSON: dist/release-assets.json
          BAIDU_SHARE_JSON: dist/baidu-share.json
          FEISHU_RELEASE_CHAT_ID: ${{ secrets.FEISHU_RELEASE_CHAT_ID || vars.FEISHU_RELEASE_CHAT_ID }}
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          FEISHU_RELEASE_SECRET: ${{ secrets.FEISHU_RELEASE_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          RELEASE_POSTER_STRICT: ${{ vars.RELEASE_POSTER_STRICT || 'false' }}
        run: |
          args=(
            --release-json "$RELEASE_ASSETS_JSON"
            --baidu-json "$BAIDU_SHARE_JSON"
            --poster-json dist/release-poster.json
            --poster-path dist/release-poster.png
            --output dist/feishu-card.json
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release-distribution/send-feishu-card.mjs "${args[@]}"

      - name: Upload distribution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution-${{ steps.release.outputs.tag }}
          if-no-files-found: ignore
          path: |
            dist/release.json
            dist/release-assets.json
            dist/baidu-share.json
            dist/feishu-card.json
            dist/release-poster.*
            dist/mita-download/*
