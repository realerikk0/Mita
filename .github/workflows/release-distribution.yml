name: Release Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Reviewed operation to run'
        required: true
        default: distribute
        type: choice
        options:
          - distribute
          - bootstrap-biyan-download-aliases
      tag:
        description: 'Existing GitHub release tag to distribute, for example v0.6.605'
        required: true
        type: string
      dry_run:
        description: 'Render plus remote read-only preflight; do not upload to Aliyun OSS or send Feishu'
        required: true
        default: true
        type: boolean
      confirm:
        description: 'Required for a non-dry-run manual dispatch: type DISTRIBUTE'
        required: false
        default: ''
        type: string
      bootstrap_confirm:
        description: 'Required for the one-time non-dry bootstrap: type BOOTSTRAP_BIYAN_ALIASES_V0633'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-distribution-live-keys
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  distribute:
    if: github.event_name == 'release' || inputs.operation == 'distribute'
    name: Publish release assets and notify Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: release-distribution
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$EVENT_TAG"
            dry_run="false"
            confirm="RELEASE_EVENT"
          else
            tag="$INPUT_TAG"
            dry_run="$INPUT_DRY_RUN"
            confirm="$INPUT_CONFIRM"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable vMAJOR.MINOR.PATCH tag: $tag" >&2
            exit 1
          fi
          if [ "$dry_run" != "true" ] && [ "$dry_run" != "false" ]; then
            echo "dry_run must resolve to true or false" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$dry_run" = "false" ] \
            && [ "$confirm" != "DISTRIBUTE" ]; then
            echo "A non-dry-run manual dispatch requires confirm=DISTRIBUTE" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Distributing release $tag (dry_run=$dry_run)"

      - name: Verify protected tag provenance
        id: provenance
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          git fetch --force --no-tags origin \
            "+refs/tags/${TAG}:refs/tags/${TAG}"
          checkout_head="$(git rev-parse HEAD)"
          live_main="$(git rev-parse origin/mita-main)"
          if [ "$checkout_head" != "$live_main" ]; then
            echo "Trusted release harness $checkout_head is not live origin/mita-main $live_main" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/mita-main; then
            echo "Tag commit $tag_commit is not an ancestor of origin/mita-main" >&2
            exit 1
          fi
          git show "${TAG}:biyan-release.json" > dist/tag-biyan-release.json
          git show "${TAG}:src-tauri/tauri.conf.json" > dist/tag-tauri.conf.json
          git show "${TAG}:src-tauri/Cargo.lock" > dist/tag-Cargo.lock
          {
            echo "source_commit=$tag_commit"
            echo "mita_main_commit=$live_main"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize distribution transaction evidence
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/distribution-transaction
          jq -n \
            --arg tag "$TAG" \
            --arg source "${{ steps.provenance.outputs.source_commit }}" \
            '{
              schema: 1,
              tag: $tag,
              sourceCommit: $source,
              status: "not-started",
              note: "No live publication mutation has started."
            }' > dist/distribution-transaction/state.json
          jq -n \
            '{
              schema: 1,
              status: "not-started",
              instructions: "No manual recovery is required.",
              commands: []
            }' > dist/distribution-transaction/recovery.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          gh release view "${{ steps.release.outputs.tag }}" \
            --json tagName,name,url,publishedAt,body,isDraft,isPrerelease,assets \
            > dist/release.json

      - name: Download release packages and provenance
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          patterns=(
            "Biyan_${VERSION}_universal.dmg"
            "Biyan_${VERSION}_x64-setup.exe"
            "Biyan_${VERSION}_x64-setup.exe.sig"
            "Biyan_${VERSION}_x64_en-US.msi"
            "Biyan_${VERSION}_amd64.AppImage"
            "Biyan_${VERSION}_amd64.AppImage.sig"
            "Biyan_${VERSION}_amd64.deb"
            "Biyan.app.tar.gz"
            "Biyan.app.tar.gz.sig"
            "candidate.json"
            "candidate.json.sig"
            "latest.json"
            "SHA256SUMS"
          )
          args=()
          for pattern in "${patterns[@]}"; do
            args+=(--pattern "$pattern")
          done
          gh release download "$TAG" \
            --dir dist/release-assets \
            "${args[@]}" \
            --clobber
          find dist/release-assets -maxdepth 1 -type f -print | sort

      - name: Validate release identity, assets, checksums, signatures, and provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-distribution/collect-release-assets.mjs \
            --release-json dist/release.json \
            --assets-dir dist/release-assets \
            --candidate-dir dist/release-assets \
            --expected-source-commit "${{ steps.provenance.outputs.source_commit }}" \
            --tag-release-json dist/tag-biyan-release.json \
            --tag-tauri-config dist/tag-tauri.conf.json \
            --tag-cargo-lock dist/tag-Cargo.lock \
            --output dist/release-assets.json
          node scripts/updater/verify-candidate.mjs \
            dist/release-assets \
            "${{ steps.release.outputs.tag }}"
          (
            cd dist/release-assets
            sha256sum --check SHA256SUMS
          )

      - name: Revalidate protected harness before poster API mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ steps.provenance.outputs.mita_main_commit }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before poster generation; retry from the new trusted harness" >&2
            exit 1
          fi

      - name: Generate release poster
        shell: bash
        env:
          JINGXING_API_KEY: ${{ secrets.JINGXING_API_KEY }}
          JINGXING_BASE_URL: https://api.jingxing.io/v1
          RELEASE_POSTER_ENABLED: ${{ vars.RELEASE_POSTER_ENABLED || 'true' }}
          RELEASE_POSTER_STRICT: ${{ vars.RELEASE_POSTER_STRICT || 'false' }}
        run: |
          node scripts/release-distribution/generate-release-poster.mjs \
            --release-json dist/release-assets.json \
            --output dist/release-poster.png \
            --metadata dist/release-poster.json

      - name: Install exact Alibaba Cloud clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          curl --proto '=https' --tlsv1.2 -fsSL \
            --connect-timeout 10 --max-time 180 \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-3.3.22-amd64.tgz \
            -o dist/tools/aliyun-cli.tgz
          echo "41a67dfd2f44c00eb628d9f91fa7c4807222de54ebe44fac3477fb9c70b3b0bc  dist/tools/aliyun-cli.tgz" \
            | sha256sum --check -
          tar -xzf dist/tools/aliyun-cli.tgz -C dist/tools
          sudo install -m 0755 dist/tools/aliyun /usr/local/bin/aliyun
          test "$(aliyun version | tr -d '\r' | sed -n '1p')" = "3.3.22"

          curl --proto '=https' --tlsv1.2 -fsSL \
            --connect-timeout 10 --max-time 180 \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            -o dist/tools/ossutil.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  dist/tools/ossutil.zip" \
            | sha256sum --check -
          unzip -q dist/tools/ossutil.zip -d dist/tools
          sudo install -m 0755 \
            dist/tools/ossutil-2.3.0-linux-amd64/ossutil \
            /usr/local/bin/ossutil
          ossutil version | tee dist/tools/ossutil-version.txt
          grep -Eq '(^|[^0-9])2\.3\.0([^0-9]|$)' dist/tools/ossutil-version.txt

      - name: Configure Alibaba Cloud CLI
        shell: bash
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: cn-hangzhou
        run: |
          set -euo pipefail

          required=(
            ALIYUN_ACCESS_KEY_ID
            ALIYUN_ACCESS_KEY_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for publishing the Biyan download manifest" >&2
              exit 1
            fi
          done
          aliyun configure set \
            --profile release \
            --mode AK \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"

      - name: Build canonical download transaction payload
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          UPDATES_CDN_BASE_URL: ${{ vars.UPDATES_CDN_BASE_URL || 'https://static.mitapp.cn' }}
          BIYAN_DOWNLOAD_MANIFEST_KEY: ${{ vars.BIYAN_DOWNLOAD_MANIFEST_KEY || 'biyan/download/latest.json' }}
          BIYAN_DOWNLOAD_PAGE_KEY: ${{ vars.BIYAN_DOWNLOAD_PAGE_KEY || 'biyan/download' }}
          BIYAN_DOWNLOAD_VERSION_ROOT: ${{ vars.BIYAN_DOWNLOAD_VERSION_ROOT || 'biyan/download/releases' }}
          LEGACY_DOWNLOAD_MANIFEST_KEY: ${{ vars.LEGACY_DOWNLOAD_MANIFEST_KEY || 'mita/download/latest.json' }}
          LEGACY_DOWNLOAD_PAGE_KEY: ${{ vars.LEGACY_DOWNLOAD_PAGE_KEY || 'mita/download' }}
        run: |
          set -euo pipefail
          cdn_base="$UPDATES_CDN_BASE_URL"
          if [ "${BIYAN_DOWNLOAD_MANIFEST_KEY#/}" != "biyan/download/latest.json" ] \
            || [ "${BIYAN_DOWNLOAD_PAGE_KEY#/}" != "biyan/download" ] \
            || [ "${BIYAN_DOWNLOAD_VERSION_ROOT%/}" != "biyan/download/releases" ] \
            || [ "${LEGACY_DOWNLOAD_MANIFEST_KEY#/}" != "mita/download/latest.json" ] \
            || [ "${LEGACY_DOWNLOAD_PAGE_KEY#/}" != "mita/download" ]; then
            echo "Download publication keys differ from the reviewed compatibility policy" >&2
            exit 1
          fi
          if [ "$cdn_base" != "https://static.mitapp.cn" ]; then
            echo "UPDATES_CDN_BASE_URL must be exactly https://static.mitapp.cn" >&2
            exit 1
          fi
          jq -e \
            --arg tag "$TAG" \
            --arg source "${{ steps.provenance.outputs.source_commit }}" \
            '.tagName == $tag
              and .provenance.schema == 1
              and .provenance.sourceCommit == $source
              and (.provenance.migrationPhase == "A"
                or .provenance.migrationPhase == "B"
                or .provenance.migrationPhase == "C")
              and ((.provenance.migrationPhase == "A" and .provenance.dataSchema == 1)
                or (.provenance.migrationPhase == "B" and .provenance.dataSchema == 2)
                or (.provenance.migrationPhase == "C" and .provenance.dataSchema == 3))' \
            dist/release-assets.json >/dev/null
          node scripts/release-distribution/build-download-manifest.mjs \
            --release-json dist/release-assets.json \
            --manifest-output dist/biyan-download/latest.json \
            --page-output dist/biyan-download/index.html \
            --cdn-base-url "$cdn_base" \
            --download-version-root "biyan/download/releases/${TAG}" \
            --download-page-url "${cdn_base}/biyan/download"

      - name: Revalidate protected harness before OSS mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ steps.provenance.outputs.mita_main_commit }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before OSS publication; retry from the new trusted harness" >&2
            exit 1
          fi

      - name: Execute recoverable download publication transaction
        shell: bash
        env:
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          TAG: ${{ steps.release.outputs.tag }}
          ALIYUN_OSS_BUCKET: mita-static
          ALIYUN_OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_REGION: cn-hangzhou
          UPDATES_CDN_BASE_URL: ${{ vars.UPDATES_CDN_BASE_URL || 'https://static.mitapp.cn' }}
        run: |
          set -euo pipefail
          args=(
            --release-json dist/release-assets.json
            --payload-dir dist/biyan-download
            --tag "$TAG"
            --evidence dist/distribution-transaction/state.json
            --recovery dist/distribution-transaction/recovery.json
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release-distribution/publish-download-transaction.mjs \
            "${args[@]}"

      - name: Revalidate protected harness before Feishu mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ steps.provenance.outputs.mita_main_commit }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Feishu notification; release state is preserved in transaction evidence" >&2
            exit 1
          fi

      - name: Send Feishu release messages
        shell: bash
        env:
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          RELEASE_ASSETS_JSON: dist/release-assets.json
          UPDATES_CDN_BASE_URL: ${{ vars.UPDATES_CDN_BASE_URL || 'https://static.mitapp.cn' }}
          BIYAN_DOWNLOAD_PAGE_KEY: ${{ vars.BIYAN_DOWNLOAD_PAGE_KEY || 'biyan/download' }}
          FEISHU_RELEASE_CHAT_ID: ${{ secrets.FEISHU_RELEASE_CHAT_ID || vars.FEISHU_RELEASE_CHAT_ID }}
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          FEISHU_RELEASE_SECRET: ${{ secrets.FEISHU_RELEASE_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          RELEASE_POSTER_STRICT: ${{ vars.RELEASE_POSTER_STRICT || 'false' }}
        run: |
          args=(
            --release-json "$RELEASE_ASSETS_JSON"
            --poster-json dist/release-poster.json
            --poster-path dist/release-poster.png
            --download-page-url "${UPDATES_CDN_BASE_URL%/}/${BIYAN_DOWNLOAD_PAGE_KEY#/}"
            --output dist/feishu-card.json
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release-distribution/send-feishu-card.mjs "${args[@]}"

      - name: Require transaction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/distribution-transaction/state.json
          test -s dist/distribution-transaction/recovery.json
          jq -e '.schema == 1 and (.status | type == "string")' \
            dist/distribution-transaction/state.json >/dev/null
          jq -e '.schema == 1 and (.status | type == "string")' \
            dist/distribution-transaction/recovery.json >/dev/null

      - name: Upload distribution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            dist/release.json
            dist/release-assets.json
            dist/tag-biyan-release.json
            dist/tag-tauri.conf.json
            dist/tag-Cargo.lock
            dist/feishu-card.json
            dist/release-poster.*
            dist/biyan-download/*
            dist/distribution-transaction/**

  bootstrap-biyan-download-aliases:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'bootstrap-biyan-download-aliases'
    name: Bootstrap the reviewed Biyan v0.6.633 compatibility aliases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-distribution
    permissions:
      contents: read
    steps:
      - name: Checkout protected distribution harness
        uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize bootstrap evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/biyan-download-alias-bootstrap
          jq -n \
            '{
              schema: 1,
              operation: "biyan-download-alias-bootstrap",
              status: "not-started",
              dryRun: null,
              note: "No remote bootstrap mutation has started."
            }' > dist/biyan-download-alias-bootstrap/state.json

      - name: Resolve exact one-time bootstrap request
        id: bootstrap
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM: ${{ inputs.bootstrap_confirm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            || [ "$WORKFLOW_REF" != "refs/heads/mita-main" ] \
            || [ "$INPUT_OPERATION" != "bootstrap-biyan-download-aliases" ]; then
            echo "The one-time alias bootstrap must be dispatched from protected mita-main" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The workflow dispatch SHA must be a full commit id" >&2
            exit 1
          fi
          if [ "$INPUT_TAG" != "v0.6.643" ]; then
            echo "The one-time alias bootstrap is locked to v0.6.643" >&2
            exit 1
          fi
          if [ "$INPUT_DRY_RUN" != "true" ] && [ "$INPUT_DRY_RUN" != "false" ]; then
            echo "dry_run must resolve to true or false" >&2
            exit 1
          fi
          if [ "$INPUT_DRY_RUN" = "false" ] \
            && [ "$INPUT_CONFIRM" != "BOOTSTRAP_BIYAN_ALIASES_V0633" ]; then
            echo "The live bootstrap requires bootstrap_confirm=BOOTSTRAP_BIYAN_ALIASES_V0633" >&2
            exit 1
          fi
          {
            echo "tag=v0.6.643"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo "source_commit=38e6d9290a8b9b0f152ff2a7eefb550e6ead7df5"
            echo "migration_phase=A"
            echo "data_schema=1"
            echo "dry_run=$INPUT_DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Verify protected harness, tag, and checkpoint
        id: provenance
        shell: bash
        env:
          TAG: ${{ steps.bootstrap.outputs.tag }}
          WORKFLOW_SHA: ${{ steps.bootstrap.outputs.workflow_sha }}
          SOURCE_COMMIT: ${{ steps.bootstrap.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          git fetch --force --no-tags origin \
            "+refs/tags/${TAG}:refs/tags/${TAG}"
          checkout_head="$(git rev-parse HEAD)"
          live_main="$(git rev-parse origin/mita-main)"
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if [ "$checkout_head" != "$WORKFLOW_SHA" ] || [ "$WORKFLOW_SHA" != "$live_main" ]; then
            echo "Trusted bootstrap harness $checkout_head is not live origin/mita-main $live_main" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
            echo "Protected tag $TAG no longer targets reviewed A13 $SOURCE_COMMIT" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" origin/mita-main
          git show "${TAG}:biyan-release.json" \
            > dist/biyan-download-alias-bootstrap/tag-biyan-release.json
          git show "${TAG}:src-tauri/tauri.conf.json" \
            > dist/biyan-download-alias-bootstrap/tag-tauri.conf.json
          jq -e \
            '.schema == 1
              and .migrationPhase == "A"
              and .dataSchema == 1' \
            dist/biyan-download-alias-bootstrap/tag-biyan-release.json >/dev/null
          jq -e '.version == "0.6.643"' \
            dist/biyan-download-alias-bootstrap/tag-tauri.conf.json >/dev/null
          {
            echo "trusted_main_commit=$live_main"
            echo "source_commit=$tag_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact Alibaba Cloud clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          curl --proto '=https' --tlsv1.2 -fsSL \
            --connect-timeout 10 --max-time 180 \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-3.3.22-amd64.tgz \
            -o dist/tools/aliyun-cli.tgz
          echo "41a67dfd2f44c00eb628d9f91fa7c4807222de54ebe44fac3477fb9c70b3b0bc  dist/tools/aliyun-cli.tgz" \
            | sha256sum --check -
          tar -xzf dist/tools/aliyun-cli.tgz -C dist/tools
          sudo install -m 0755 dist/tools/aliyun /usr/local/bin/aliyun
          test "$(aliyun version | tr -d '\r' | sed -n '1p')" = "3.3.22"

          curl --proto '=https' --tlsv1.2 -fsSL \
            --connect-timeout 10 --max-time 180 \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            -o dist/tools/ossutil.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  dist/tools/ossutil.zip" \
            | sha256sum --check -
          unzip -q dist/tools/ossutil.zip -d dist/tools
          sudo install -m 0755 \
            dist/tools/ossutil-2.3.0-linux-amd64/ossutil \
            /usr/local/bin/ossutil
          ossutil version | tee dist/tools/ossutil-version.txt
          grep -Eq '(^|[^0-9])2\.3\.0([^0-9]|$)' dist/tools/ossutil-version.txt

      - name: Configure Alibaba Cloud CLI
        shell: bash
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: cn-hangzhou
        run: |
          set -euo pipefail
          required=(
            ALIYUN_ACCESS_KEY_ID
            ALIYUN_ACCESS_KEY_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for the reviewed Biyan alias bootstrap" >&2
              exit 1
            fi
          done
          aliyun configure set \
            --profile release \
            --mode AK \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"

      - name: Revalidate protected harness before OSS access
        shell: bash
        env:
          EXPECTED_MAIN: ${{ steps.provenance.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ steps.provenance.outputs.source_commit }}
          TAG: ${{ steps.bootstrap.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          live_tag="$(git ls-remote --exit-code origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk -v tag="refs/tags/${TAG}" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before the reviewed bootstrap" >&2
            exit 1
          fi
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "Protected tag moved before the reviewed bootstrap" >&2
            exit 1
          fi

      - name: Execute allowlisted Biyan alias bootstrap
        shell: bash
        env:
          DRY_RUN: ${{ steps.bootstrap.outputs.dry_run }}
          TAG: ${{ steps.bootstrap.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.bootstrap.outputs.source_commit }}
          MIGRATION_PHASE: ${{ steps.bootstrap.outputs.migration_phase }}
          DATA_SCHEMA: ${{ steps.bootstrap.outputs.data_schema }}
          ALIYUN_OSS_BUCKET: mita-static
          ALIYUN_OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-hangzhou
          UPDATES_CDN_BASE_URL: https://static.mitapp.cn
        run: |
          set -euo pipefail
          args=(
            --tag "$TAG"
            --source-commit "$SOURCE_COMMIT"
            --migration-phase "$MIGRATION_PHASE"
            --data-schema "$DATA_SCHEMA"
            --evidence dist/biyan-download-alias-bootstrap/state.json
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/release-distribution/bootstrap-biyan-download-aliases.mjs \
            "${args[@]}"

      - name: Require bootstrap evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/biyan-download-alias-bootstrap/state.json
          jq -e \
            '.schema == 1
              and .operation == "biyan-download-alias-bootstrap"
              and (.status | type == "string")' \
            dist/biyan-download-alias-bootstrap/state.json >/dev/null

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biyan-download-alias-bootstrap-v0.6.643-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/biyan-download-alias-bootstrap/**
