name: Deploy Biyan Updater Router

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate bundle only"
        required: true
        default: true
        type: boolean
      confirmation:
        description: "For a real deploy type DEPLOY"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: biyan-updater-router-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mita-main'
    runs-on: ubuntu-latest
    environment: release-distribution
    env:
      WRANGLER_CONFIG: scripts/updater/wrangler.generated.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact live mita-main source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/mita-main"
          git fetch --no-tags --force origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          remote_sha="$(git rev-parse --verify 'refs/remotes/origin/mita-main^{commit}')"
          test "$GITHUB_SHA" = "$head_sha"
          test "$GITHUB_SHA" = "$remote_sha"
          test "$head_sha" = "$remote_sha"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test routing contract
        run: node --test scripts/updater/__tests__/updater.test.mjs

      - name: Render deployment config
        env:
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail
          [ -n "$R2_BUCKET" ]
          sed -e "s/__UPDATER_BUCKET__/$R2_BUCKET/" \
            scripts/updater/wrangler.toml > "$WRANGLER_CONFIG"
          test -f "$(dirname "$WRANGLER_CONFIG")/worker.mjs"
          npx --yes wrangler@4.114.0 deploy --dry-run \
            --config "$WRANGLER_CONFIG"

      - name: Deploy Worker and signing secret
        if: inputs.dry_run != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          ROLLOUT_SALT: ${{ secrets.BIYAN_UPDATER_ROLLOUT_SALT }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY"
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          [ -n "$BIYAN_SIGNING_KEY" ] && [ -n "$ROLLOUT_SALT" ]
          # A first deploy has no secrets yet and therefore fails closed with
          # 401/503. Existing Worker secrets are retained during redeploys.
          # The bucket already exists. Disable Wrangler's automatic resource
          # provisioning so this least-privilege deploy never probes the R2
          # management API.
          npx --yes wrangler@4.114.0 deploy --no-x-provision \
            --config "$WRANGLER_CONFIG"
          printf '%s' "$BIYAN_SIGNING_KEY" \
            | npx --yes wrangler@4.114.0 secret put BIYAN_SIGNING_KEY --config "$WRANGLER_CONFIG"
          printf '%s' "$ROLLOUT_SALT" \
            | npx --yes wrangler@4.114.0 secret put ROLLOUT_SALT --config "$WRANGLER_CONFIG"
          npx --yes wrangler@4.114.0 deploy --no-x-provision \
            --config "$WRANGLER_CONFIG"

          VERIFY_DIR="dist/router-verification"
          ENDPOINT="https://updates.mita.so/biyan/v1/stable/windows/x86_64/0.6.633"
          UNSIGNED_BODY="${RUNNER_TEMP:?}/biyan-updater-unsigned-body-${GITHUB_RUN_ID}.json"
          SIGNED_BODY="${RUNNER_TEMP:?}/biyan-updater-signed-body-${GITHUB_RUN_ID}"
          SIGNED_HEADERS="${RUNNER_TEMP:?}/biyan-updater-signed-headers-${GITHUB_RUN_ID}.json"
          SIGNED_RESPONSE_HEADERS="${RUNNER_TEMP:?}/biyan-updater-signed-response-${GITHUB_RUN_ID}.headers"
          EVIDENCE_FILE="$VERIFY_DIR/evidence.json"
          umask 077
          mkdir -p "$VERIFY_DIR"
          trap 'rm -f "$SIGNED_HEADERS" "$SIGNED_RESPONSE_HEADERS" "$UNSIGNED_BODY" "$SIGNED_BODY"' EXIT

          unsigned_status="000"
          for attempt in $(seq 1 24); do
            if unsigned_status="$(
              curl --silent --show-error --connect-timeout 10 --max-time 20 \
                --output "$UNSIGNED_BODY" --write-out '%{http_code}' "$ENDPOINT"
            )"; then
              if [ "$unsigned_status" = "401" ] \
                && jq -e '. == {"error":"unauthorized"}' "$UNSIGNED_BODY" >/dev/null 2>&1; then
                break
              fi
            else
              unsigned_status="000"
            fi
            [ "$attempt" -eq 24 ] || sleep 5
          done
          test "$unsigned_status" = "401"
          jq -e '. == {"error":"unauthorized"}' "$UNSIGNED_BODY" >/dev/null

          signed_status="000"
          signed_state=""
          # Before phase A starts, the stable policy is intentionally absent.
          # A signed request must therefore fail closed as policy-unavailable,
          # which is distinct from an existing policy with no transition.
          for attempt in $(seq 1 24); do
            node scripts/updater/sign-request.mjs \
              --current-version 0.6.633 \
              --target-version 0.6.643 \
              --rollout 0 \
              --output "$SIGNED_HEADERS"
            jq -e '
              (keys | sort) == [
                "X-Client-Session",
                "X-Client-Version",
                "X-Request-Id",
                "X-Request-Time",
                "X-Request-Token"
              ]
              and .["X-Client-Version"] == "0.6.633"
              and (.["X-Client-Session"] | test("^[0-9A-Za-z._:-]{8,200}$"))
              and (.["X-Request-Id"] | test("^[0-9a-f]{64}$"))
              and (.["X-Request-Time"] | test("^[0-9]+$"))
              and (.["X-Request-Token"] | test("^[0-9a-f]{64}$"))
            ' "$SIGNED_HEADERS" >/dev/null
            signed_headers=()
            while IFS= read -r header; do
              signed_headers+=(--header "$header")
            done < <(jq -r 'to_entries[] | "\(.key): \(.value)"' "$SIGNED_HEADERS")
            if signed_status="$(
              curl --silent --show-error --connect-timeout 10 --max-time 20 \
                "${signed_headers[@]}" \
                --dump-header "$SIGNED_RESPONSE_HEADERS" \
                --output "$SIGNED_BODY" --write-out '%{http_code}' "$ENDPOINT"
            )"; then
              signed_state="$(awk -F ': *' '
                tolower($1) == "x-biyan-updater-state" {
                  gsub(/\r/, "", $2)
                  value = $2
                }
                END { print value }
              ' "$SIGNED_RESPONSE_HEADERS")"
              if [ "$signed_status" = "204" ] \
                && [ "$signed_state" = "policy-unavailable" ] \
                && [ ! -s "$SIGNED_BODY" ]; then
                break
              fi
            else
              signed_status="000"
            fi
            [ "$attempt" -eq 24 ] || sleep 5
          done
          test "$signed_status" = "204"
          test "$signed_state" = "policy-unavailable"
          test ! -s "$SIGNED_BODY"

          jq -n \
            --arg schema "biyan-updater-router-deployment-evidence/v1" \
            --arg endpoint "$ENDPOINT" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg unsignedStatus "$unsigned_status" \
            --arg signedPreAStatus "$signed_status" \
            --arg signedPreAState "$signed_state" \
            --arg verifiedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              schema: $schema,
              endpoint: $endpoint,
              sourceCommit: $sourceCommit,
              unsignedStatus: $unsignedStatus,
              signedPreAStatus: $signedPreAStatus,
              signedPreAState: $signedPreAState,
              verifiedAt: $verifiedAt
            }' > "$EVIDENCE_FILE"
          jq -e --arg sourceCommit "$GITHUB_SHA" '
            (keys | sort) == [
              "endpoint",
              "schema",
              "signedPreAState",
              "signedPreAStatus",
              "sourceCommit",
              "unsignedStatus",
              "verifiedAt"
            ]
            and .schema == "biyan-updater-router-deployment-evidence/v1"
            and .sourceCommit == $sourceCommit
            and .unsignedStatus == "401"
            and .signedPreAStatus == "204"
            and .signedPreAState == "policy-unavailable"
          ' "$EVIDENCE_FILE" >/dev/null
          rm -f "$SIGNED_HEADERS" "$SIGNED_RESPONSE_HEADERS" "$UNSIGNED_BODY" "$SIGNED_BODY"
          trap - EXIT

      - name: Upload router deployment evidence
        if: inputs.dry_run != true && success()
        uses: actions/upload-artifact@v4
        with:
          name: updater-router-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/router-verification/evidence.json
          if-no-files-found: error
          retention-days: 30
