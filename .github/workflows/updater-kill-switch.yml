name: Stable Updater Kill Switch

on:
  workflow_dispatch:
    inputs:
      expected_current:
        description: "Logical CAS value currently stored in stable policy"
        required: true
        type: string
      state:
        description: "Emergency action; resuming requires a health-gated promotion"
        required: true
        type: choice
        options: [paused]
      confirmation:
        description: "Type APPLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: biyan-stable-updater-promotion
  cancel-in-progress: false

jobs:
  update:
    name: Atomically pause Router policy
    if: github.ref == 'refs/heads/mita-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release-distribution
    env:
      AWS_DEFAULT_REGION: auto
      POLICY_KEY: biyan/updater/stable/policy.json
      OPEN_TRANSACTION_KEY: biyan/updater/transactions/open.json
      DYNAMIC_UPDATER_BASE_URL: https://updates.mita.so/biyan/v1/stable
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - name: Check out trusted policy writer
        uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact live trusted control plane and operator intent
        env:
          STATE: ${{ inputs.state }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$STATE" = paused
          test "$CONFIRMATION" = APPLY
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse refs/remotes/origin/mita-main)"

      - name: Apply fail-closed Router policy pause transaction
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          ROLLOUT_SALT: ${{ secrets.BIYAN_UPDATER_ROLLOUT_SALT }}
        run: |
          set -euo pipefail
          bash scripts/updater/run-router-pause-transaction.sh

      - name: Upload kill-switch transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-kill-switch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/router-pause/
          if-no-files-found: error
          retention-days: 30
