name: Verify Legacy A Updater Pin

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Latest approved A-series bridge version"
        required: true
        default: "0.6.634"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Legacy manifests remain byte-identical and pinned to A
    runs-on: ubuntu-latest
    steps:
      - name: Download both immutable legacy entrypoints
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || vars.LEGACY_BRIDGE_VERSION || '0.6.634' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 10 --retry-delay 6 \
            https://static.mitapp.cn/mita/latest.json -o dist/aliyun-latest.json
          curl -fsSL --retry 10 --retry-delay 6 \
            https://updates.mita.so/mita/latest.json -o dist/r2-latest.json
          cmp dist/aliyun-latest.json dist/r2-latest.json
          test "$(jq -r .version dist/aliyun-latest.json)" = "$EXPECTED_VERSION"
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg platform "$platform" \
              '.platforms[$platform].url | type == "string" and length > 0' \
              dist/aliyun-latest.json >/dev/null
            jq -e --arg platform "$platform" \
              '.platforms[$platform].signature | type == "string" and length > 0' \
              dist/aliyun-latest.json >/dev/null
          done
          sha256sum dist/aliyun-latest.json dist/r2-latest.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-a-pin-${{ github.run_id }}
          if-no-files-found: ignore
          path: dist/*.json
