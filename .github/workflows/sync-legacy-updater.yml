name: Verify Legacy Updater Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Legacy manifests match the published terminal release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test the fail-closed manifest verifier
        run: node --test scripts/updater/__tests__/legacy-manifest-policy.test.mjs

      - name: Download both live legacy entrypoints and the published manifest
        run: |
          set -euo pipefail
          policy=scripts/updater/legacy-bridge-policy.json
          mkdir -p dist
          aliyun_url="$(jq -er '.manifestUrls.aliyun' "$policy")"
          r2_url="$(jq -er '.manifestUrls.r2' "$policy")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 120 \
            "$aliyun_url" -o dist/aliyun-latest.json
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 120 \
            "$r2_url" -o dist/r2-latest.json

          version="$(jq -er '.version' dist/aliyun-latest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            > dist/github-release.json
          asset_id="$(jq -er '
            [.assets[] | select(
              .name == "latest.json"
              and .state == "uploaded"
              and (.id | type == "number" and . > 0)
            )] as $matches
            | if ($matches | length) == 1 then $matches[0].id
              else error("published release must contain one latest.json") end
          ' dist/github-release.json)"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > dist/github-latest.json

      - name: Verify exact published state and write evidence
        run: |
          set -euo pipefail
          node scripts/updater/live-terminal-manifest-policy.mjs \
            --aliyun dist/aliyun-latest.json \
            --r2 dist/r2-latest.json \
            --github-release dist/github-release.json \
            --github-manifest dist/github-latest.json \
            --evidence dist/live-terminal-manifest-verification.json
          sha256sum \
            dist/aliyun-latest.json \
            dist/r2-latest.json \
            dist/github-latest.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bridge-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: dist/*.json
