name: Verify Legacy Updater Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Legacy manifests match the tracked bridge state
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test the fail-closed manifest verifier
        run: node --test scripts/updater/__tests__/legacy-manifest-policy.test.mjs

      - name: Download both immutable legacy entrypoints
        run: |
          set -euo pipefail
          policy=scripts/updater/legacy-bridge-policy.json
          mkdir -p dist
          cp "$policy" dist/legacy-bridge-policy.json
          aliyun_url="$(jq -er '.manifestUrls.aliyun' "$policy")"
          r2_url="$(jq -er '.manifestUrls.r2' "$policy")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 120 \
            "$aliyun_url" -o dist/aliyun-latest.json
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 120 \
            "$r2_url" -o dist/r2-latest.json

      - name: Verify tracked state and write evidence
        run: |
          set -euo pipefail
          node scripts/updater/legacy-manifest-policy.mjs \
            --aliyun dist/aliyun-latest.json \
            --r2 dist/r2-latest.json \
            --evidence dist/legacy-manifest-verification.json
          sha256sum dist/aliyun-latest.json dist/r2-latest.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bridge-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: dist/*.json
