name: Promote Desktop Update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed candidate tag, for example v0.6.637"
        required: true
        type: string
      phase:
        description: "One-shot DIRECT_C promotion, or terminal RECOVERY"
        required: true
        type: choice
        options: [DIRECT_C, RECOVERY]
      from_version:
        description: "Only this installed version may receive the update"
        required: true
        type: string
      expected_current:
        description: "Logical CAS value currently stored in stable policy"
        required: true
        type: string
      rollout:
        description: "Stable cohort percentage"
        required: true
        type: choice
        options: ["0", "5", "25", "100"]
      dry_run:
        description: "Validate and render policy without changing production"
        required: true
        default: true
        type: boolean
      confirmation:
        description: "For a real promotion type PROMOTE"
        required: false
        type: string
      smoke_run_id:
        description: "Successful Direct Qualification run, or RECOVERY Upgrade Smoke run ID"
        required: true
        type: string
      smoke_evidence_sha256:
        description: "SHA-256 of upgrade-smoke.json from that run"
        required: true
        type: string
      health_evidence_sha256:
        description: "SHA-256 of rollout-health.json from that run"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: biyan-stable-updater-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, snapshot, and promote signed candidate
    if: github.ref == 'refs/heads/mita-main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-distribution
    env:
      AWS_DEFAULT_REGION: auto
      ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
      OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
      OSS_REGION: ${{ vars.ALIYUN_REGION || 'cn-hangzhou' }}
      DYNAMIC_UPDATER_BASE_URL: "https://updates.mita.so/biyan/v1/stable"
      POLICY_KEY: "biyan/updater/stable/policy.json"
      OPEN_TRANSACTION_KEY: "biyan/updater/transactions/open.json"
    steps:
      - name: Checkout trusted promotion tooling
        uses: actions/checkout@v4
        with:
          ref: mita-main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate operator intent
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRMATION" != "PROMOTE" ]; then
            echo "Real promotion requires confirmation PROMOTE" >&2
            exit 1
          fi

      - name: Download immutable published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/candidate
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,targetCommitish,publishedAt \
            > dist/release.json
          test "$(jq -r .tagName dist/release.json)" = "$TAG"
          test "$(jq -r .isDraft dist/release.json)" = "false"
          test "$(jq -r .isPrerelease dist/release.json)" = "false"
          jq -e '.publishedAt | strings | test("Z$")' dist/release.json >/dev/null
          for pattern in candidate.json candidate.json.sig latest.json SHA256SUMS \
            "Biyan.app.tar.gz*" "Biyan_*_universal.dmg" \
            "Biyan_*_x64-setup.exe*" "Biyan_*_x64_en-US.msi" \
            "Biyan_*_amd64.AppImage*" "Biyan_*_amd64.deb"; do
            gh release download "$TAG" --dir dist/candidate --pattern "$pattern" --clobber
          done
          (cd dist/candidate && sha256sum --check SHA256SUMS)
          node scripts/updater/verify-candidate.mjs dist/candidate "$TAG"
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$(jq -r .sourceCommit dist/candidate/candidate.json)"
          git merge-base --is-ancestor \
            "$(jq -r .sourceCommit dist/candidate/candidate.json)" \
            refs/remotes/origin/mita-main

      - name: Require successful phase-specific canary and health evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
          SMOKE_SHA256: ${{ inputs.smoke_evidence_sha256 }}
          HEALTH_SHA256: ${{ inputs.health_evidence_sha256 }}
          PHASE: ${{ inputs.phase }}
          FROM_VERSION: ${{ inputs.from_version }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh run view "$SMOKE_RUN_ID" \
            --json attempt,conclusion,headSha,workflowName,url > dist/smoke-run.json
          test "$(jq -r .conclusion dist/smoke-run.json)" = "success"
          if [ "$PHASE" = "DIRECT_C" ]; then
            test "$(jq -r .workflowName dist/smoke-run.json)" = \
              "Biyan Direct Qualification"
            git merge-base --is-ancestor \
              "$(jq -r .headSha dist/smoke-run.json)" \
              refs/remotes/origin/mita-main
          fi
          if [ "$PHASE" = "DIRECT_C" ]; then
            mkdir -p dist/evidence
            gh run download "$SMOKE_RUN_ID" --name biyan-promotion-evidence --dir dist/evidence
            node scripts/updater/verify-promotion-evidence.mjs \
              --smoke dist/evidence/upgrade-smoke.json \
              --smoke-sha256 "$SMOKE_SHA256" \
              --health dist/evidence/rollout-health.json \
                --health-sha256 "$HEALTH_SHA256" \
                --output-dir dist/state
            node scripts/updater/direct-qualification-evidence.mjs validate-policy \
              --policy scripts/updater/direct-qualification-policy.json
            test "$(jq -er .candidate.manifestSha256 \
              scripts/updater/direct-qualification-policy.json)" = \
              "$(jq -er .manifestSha256 dist/candidate/candidate.json)"
            for binding in \
              "windows:windowsExe" \
              "macos:macosDmg" \
              "linux:linuxAppImage"; do
              platform="${binding%%:*}"
              candidate_key="${binding#*:}"
              test "$(jq -er --arg platform "$platform" \
                '.candidate.assets[$platform].sha256' \
                scripts/updater/direct-qualification-policy.json)" = \
                "$(jq -er --arg key "$candidate_key" \
                '.distributionAssets[$key].sha256' \
                dist/candidate/candidate.json)"
            done
            jq -e \
              --argjson run "$SMOKE_RUN_ID" \
              --argjson attempt "$(jq -er .workflow.runAttempt \
                dist/state/verified-smoke.json)" \
              --arg head "$(jq -r .headSha dist/smoke-run.json)" \
              --arg tag "$(jq -r .tag dist/candidate/candidate.json)" \
              --arg version "$(jq -r .version dist/candidate/candidate.json)" \
              --arg commit "$(jq -r .sourceCommit dist/candidate/candidate.json)" \
              --arg manifest "$(jq -r .manifestSha256 dist/candidate/candidate.json)" \
              --slurpfile policy \
                scripts/updater/direct-qualification-policy.json '
                .status == "passed"
                and .observationScope == "github-native-direct-qualification"
                and .deploymentMode == "direct-c"
                and .candidateTag == $tag
                and .candidateVersion == $version
                and .sourceCommit == $commit
                and .candidateManifestSha256 == $manifest
                and .currentVersion == "0.6.633"
                and .automaticUpgradeFloor == "0.6.611"
                and .manualCompatibilityFloor == "0.6.608"
                and .platforms == ["windows", "macos", "linux"]
                and .scenarios == [
                  "legacy-manual-to-c",
                  "legacy-auto-to-c",
                  "current-to-c",
                  "fresh-c",
                  "a-to-c",
                  "b-to-c",
                  "c-to-c"
                ]
                and .sourceVersions == [
                  "0.6.608",
                  "0.6.611",
                  "0.6.633",
                  "0.6.643",
                  "0.6.644",
                  "0.6.645"
                ]
                and .sampleSize == 16
                and .attempts == 16
                and .passedAttempts == 16
                and .failedAttempts == 0
                and (.harnessSha256 | test("^[0-9a-f]{64}$"))
                and (.qualificationMatrixSha256 | test("^[0-9a-f]{64}$"))
                and .workflow.name == "Biyan Direct Qualification"
                and .workflow.path ==
                  ".github/workflows/biyan-direct-qualification.yml"
                and .workflow.runId == $run
                and (.workflow.runAttempt | type == "number" and . > 0)
                and .workflow.headSha == $head
                and (.results | length) == 16
                and (
                  [.results[]
                    | select(.sourceVersion == "0.6.608")
                    | .qualificationMode] | unique
                ) == ["manual-installer"]
                and (
                  [.results[]
                    | select(.sourceVersion == "0.6.611")
                    | .qualificationMode] | unique
                ) == ["automatic-updater"]
                and (
                  .results
                  | map({
                      lane,
                      platform,
                      scenario,
                      sourceVersion,
                      status
                    })
                ) == (
                  $policy[0].lanes
                  | map({
                      lane: .id,
                      platform,
                      scenario,
                      sourceVersion,
                      status: "passed"
                    })
                )
                and all(
                  .results[];
                  .runId == $run
                  and .runAttempt == $attempt
                  and (.migrationReportSha256 | test("^[0-9a-f]{64}$"))
                  and (.inputManifestSha256 | test("^[0-9a-f]{64}$"))
                  and (.snapshotSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifactSha256 | test("^[0-9a-f]{64}$"))
                )
                and (
                  .artifactDigests | keys | sort
                ) == (
                  $policy[0].lanes | map(.id) | sort
                )
                and all(
                  .artifactDigests
                  | to_entries[];
                  (.value.id | type == "number" and . > 0)
                  and .value.name == (
                    "direct-qualification-" + .key + "-"
                    + ($run | tostring) + "-"
                    + ($attempt | tostring)
                  )
                  and (.value.sha256 | test("^[0-9a-f]{64}$"))
                )
              ' dist/state/verified-smoke.json >/dev/null
            jq -e \
              --arg tag "$(jq -r .tag dist/candidate/candidate.json)" \
              --arg commit "$(jq -r .sourceCommit dist/candidate/candidate.json)" \
              --arg manifest "$(jq -r .manifestSha256 dist/candidate/candidate.json)" \
              --slurpfile smoke dist/state/verified-smoke.json '
                .status == "healthy"
                and .observationScope == "github-native-direct-qualification"
                and .deploymentMode == "direct-c"
                and .candidateTag == $tag
                and .sourceCommit == $commit
                and .candidateManifestSha256 == $manifest
                and .sampleSize == 16
                and .attempts == 16
                and .passedAttempts == 16
                and .failedAttempts == 0
                and .p0Incidents == 0
                and .p1Incidents == 0
                and .dataLossIncidents == 0
                and .migrationFailureRate == 0
                and .harnessSha256 == $smoke[0].harnessSha256
                and .qualificationMatrixSha256 ==
                  $smoke[0].qualificationMatrixSha256
              ' dist/state/verified-health.json >/dev/null
          else
            test "$(jq -r .workflowName dist/smoke-run.json)" = \
              "Biyan Upgrade Smoke"
            smoke_head="$(jq -er .headSha dist/smoke-run.json)"
            smoke_attempt="$(jq -er '.attempt | select(type == "number" and . > 0)' \
              dist/smoke-run.json)"
            candidate_source="$(jq -er .sourceCommit dist/candidate/candidate.json)"
            git merge-base --is-ancestor "$candidate_source" "$smoke_head"
            git merge-base --is-ancestor "$smoke_head" refs/remotes/origin/mita-main

            recovery_harness_paths=(
              .github/workflows/biyan-upgrade-smoke.yml
              autoqa/migration_runner.py
              scripts/ci/release-train-policy.json
              scripts/updater/prepare-recovery-qualification-inputs.py
              scripts/updater/recovery-qualification-evidence.mjs
            )
            if ! git diff --quiet "$smoke_head" refs/remotes/origin/mita-main -- \
              "${recovery_harness_paths[@]}"; then
              echo "RECOVERY qualification harness drifted after the smoke run" >&2
              exit 1
            fi

            recovery_artifact="biyan-promotion-evidence-${SMOKE_RUN_ID}-${smoke_attempt}"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SMOKE_RUN_ID}/artifacts?per_page=100" \
              > dist/smoke-artifacts.json
            jq -e \
              --arg name "$recovery_artifact" \
              --argjson run "$SMOKE_RUN_ID" \
              --arg head "$smoke_head" '
                [.[].artifacts[]? | select(.name == $name)] as $matches
                | ($matches | length) == 1
                and ($matches[0].expired == false)
                and ($matches[0].id | type == "number" and . > 0)
                and ($matches[0].size_in_bytes | type == "number" and . > 0)
                and ($matches[0].digest | test("^sha256:[0-9a-f]{64}$"))
                and ($matches[0].workflow_run.id == $run)
                and ($matches[0].workflow_run.head_sha == $head)
              ' dist/smoke-artifacts.json >/dev/null

            mkdir -p dist/evidence
            gh run download "$SMOKE_RUN_ID" --name "$recovery_artifact" --dir dist/evidence
            node scripts/updater/verify-promotion-evidence.mjs \
              --smoke dist/evidence/upgrade-smoke.json \
              --smoke-sha256 "$SMOKE_SHA256" \
              --health dist/evidence/rollout-health.json \
                --health-sha256 "$HEALTH_SHA256" \
                --output-dir dist/state
            train_policy="scripts/ci/release-train-policy.json"
            train_source_tag="$(jq -er \
              '.supersededTerminalReleases[-1].tag' "$train_policy")"
            train_source_commit="$(jq -er \
              '.supersededTerminalReleases[-1].sourceCommit' "$train_policy")"
            test "$(jq -er \
              '.supersededTerminalReleases[-1].status' "$train_policy")" = \
              "published-superseded"
            test "$(jq -er \
              '.supersededTerminalReleases[-1].version' "$train_policy")" = \
              "$FROM_VERSION"
            jq -e \
              --arg tag "$(jq -er .tag dist/candidate/candidate.json)" \
              --arg version "$(jq -er .version dist/candidate/candidate.json)" \
              --arg commit "$candidate_source" '
                .schema == 4
                and .activeTrain == null
                and .activeTerminalRelease.tag == $tag
                and .activeTerminalRelease.version == $version
                and .activeTerminalRelease.sourceCommit == $commit
                and .activeTerminalRelease.migrationPhase == "C"
                and .activeTerminalRelease.dataSchema == 3
              ' "$train_policy" >/dev/null
            jq -e \
              --argjson run "$SMOKE_RUN_ID" \
              --argjson attempt "$smoke_attempt" \
              --arg head "$smoke_head" \
              --arg from "$FROM_VERSION" \
              --arg source_tag "$train_source_tag" \
              --arg source_commit "$train_source_commit" \
              --arg tag "$(jq -er .tag dist/candidate/candidate.json)" \
              --arg version "$(jq -er .version dist/candidate/candidate.json)" \
              --arg commit "$candidate_source" \
              --arg manifest "$(jq -er .manifestSha256 dist/candidate/candidate.json)" '
                .status == "passed"
                and .observationScope == "github-native-recovery-qualification"
                and .deploymentMode == "recovery"
                and .sourceVersion == $from
                and .sourceVersions == [$from]
                and .sourceTag == $source_tag
                and .sourceReleaseCommit == $source_commit
                and (.sourceManifestSha256 | test("^[0-9a-f]{64}$"))
                and .candidateTag == $tag
                and .candidateVersion == $version
                and .sourceCommit == $commit
                and .candidateManifestSha256 == $manifest
                and .platforms == ["windows", "macos", "linux"]
                and .scenarios == ["source-to-recovery"]
                and .sampleSize == 3
                and .attempts == 3
                and .passedAttempts == 3
                and .failedAttempts == 0
                and (.contractSha256 | test("^[0-9a-f]{64}$"))
                and (.harnessSha256 | test("^[0-9a-f]{64}$"))
                and (.qualificationMatrixSha256 | test("^[0-9a-f]{64}$"))
                and .workflow.name == "Biyan Upgrade Smoke"
                and .workflow.path == ".github/workflows/biyan-upgrade-smoke.yml"
                and .workflow.runId == $run
                and .workflow.runAttempt == $attempt
                and .workflow.headSha == $head
                and (.results | length) == 3
                and (
                  .artifactDigests | keys | sort
                ) == [
                  "source-to-recovery-linux",
                  "source-to-recovery-macos",
                  "source-to-recovery-windows"
                ]
                and (
                  .artifactDigests as $digests
                  | all(
                      .results[];
                      .artifactSha256 == $digests[.lane].sha256
                    )
                )
                and all(
                  .artifactDigests | to_entries[];
                  (.value.id | type == "number" and . > 0)
                  and .value.name == (
                    "recovery-qualification-"
                    + (.key | sub("^source-to-recovery-"; ""))
                    + "-" + ($run | tostring)
                    + "-" + ($attempt | tostring)
                  )
                  and (.value.sha256 | test("^[0-9a-f]{64}$"))
                )
                and (
                  .results
                  | map({
                      lane,
                      platform,
                      runner,
                      scenario,
                      qualificationMode,
                      sourceVersion,
                      candidateVersion,
                      status
                    })
                  | sort_by(.platform)
                ) == [
                  {
                    lane: "source-to-recovery-linux",
                    platform: "linux",
                    runner: "ubuntu-24.04",
                    scenario: "source-to-recovery",
                    qualificationMode: "automatic-updater",
                    sourceVersion: $from,
                    candidateVersion: $version,
                    status: "passed"
                  },
                  {
                    lane: "source-to-recovery-macos",
                    platform: "macos",
                    runner: "macos-15-intel",
                    scenario: "source-to-recovery",
                    qualificationMode: "automatic-updater",
                    sourceVersion: $from,
                    candidateVersion: $version,
                    status: "passed"
                  },
                  {
                    lane: "source-to-recovery-windows",
                    platform: "windows",
                    runner: "windows-2022",
                    scenario: "source-to-recovery",
                    qualificationMode: "automatic-updater",
                    sourceVersion: $from,
                    candidateVersion: $version,
                    status: "passed"
                  }
                ]
              ' dist/state/verified-smoke.json >/dev/null
            jq -e \
              --arg from "$FROM_VERSION" \
              --arg source_tag "$train_source_tag" \
              --arg source_commit "$train_source_commit" \
              --arg tag "$(jq -er .tag dist/candidate/candidate.json)" \
              --arg version "$(jq -er .version dist/candidate/candidate.json)" \
              --arg commit "$candidate_source" \
              --arg manifest "$(jq -er .manifestSha256 dist/candidate/candidate.json)" \
              --slurpfile smoke dist/state/verified-smoke.json '
                .status == "healthy"
                and .observationScope == "github-native-recovery-qualification"
                and .deploymentMode == "recovery"
                and .sourceVersion == $from
                and .sourceTag == $source_tag
                and .sourceReleaseCommit == $source_commit
                and (.sourceManifestSha256 | test("^[0-9a-f]{64}$"))
                and .candidateTag == $tag
                and .candidateVersion == $version
                and .sourceCommit == $commit
                and .candidateManifestSha256 == $manifest
                and .platforms == ["windows", "macos", "linux"]
                and .scenarios == ["source-to-recovery"]
                and .sampleSize == 3
                and .attempts == 3
                and .passedAttempts == 3
                and .failedAttempts == 0
                and .p0Incidents == 0
                and .p1Incidents == 0
                and .dataLossIncidents == 0
                and .migrationFailureRate == 0
                and .contractSha256 == $smoke[0].contractSha256
                and .harnessSha256 == $smoke[0].harnessSha256
                and .qualificationMatrixSha256 == $smoke[0].qualificationMatrixSha256
              ' dist/state/verified-health.json >/dev/null
          fi

      - name: Install exact production store clients
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://aliyuncli.alicdn.com/aliyun-cli-linux-3.3.22-amd64.tgz \
            -o dist/tools/aliyun-cli.tgz
          echo "41a67dfd2f44c00eb628d9f91fa7c4807222de54ebe44fac3477fb9c70b3b0bc  dist/tools/aliyun-cli.tgz" \
            | sha256sum --check -
          tar -xzf dist/tools/aliyun-cli.tgz -C dist/tools
          sudo install -m 0755 dist/tools/aliyun /usr/local/bin/aliyun
          aliyun version | tee dist/tools/aliyun-version.txt
          grep -Eq '(^|[^0-9])3\.3\.22([^0-9]|$)' dist/tools/aliyun-version.txt

          curl --proto '=https' --tlsv1.2 -fsSL \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip \
            -o dist/tools/ossutil.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  dist/tools/ossutil.zip" \
            | sha256sum --check -
          unzip -q dist/tools/ossutil.zip -d dist/tools
          sudo install -m 0755 \
            dist/tools/ossutil-2.3.0-linux-amd64/ossutil \
            /usr/local/bin/ossutil
          ossutil version | tee dist/tools/ossutil-version.txt
          grep -Eq '(^|[^0-9])2\.3\.0([^0-9]|$)' dist/tools/ossutil-version.txt

      - name: Revalidate exact live main before release secrets
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/mita-main"
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = \
            "$(git rev-parse refs/remotes/origin/mita-main)"

      - name: Dry-run remote preflight and unfinished transaction gate
        id: remote_preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET || vars.ALIYUN_OSS_BUCKET || 'mita-static' }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          ROLLOUT_SALT: ${{ secrets.BIYAN_UPDATER_ROLLOUT_SALT }}
          PHASE: ${{ inputs.phase }}
          FROM_VERSION: ${{ inputs.from_version }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          ROLLOUT: ${{ inputs.rollout }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p dist/state/probes
          r2_endpoint="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          oss_endpoint="${ALIYUN_OSS_ENDPOINT#https://}"
          oss_endpoint="https://${oss_endpoint#http://}"

          bash scripts/updater/run-promotion-transaction.sh \
            --recover-terminal-only
          echo "committed_same_request=$(jq -er .sameRequest \
            dist/state/terminal-promotion-recovery.json)" >>"$GITHUB_OUTPUT"

          probe_r2() {
            local key="$1" name="$2" rc
            set +e
            aws s3api head-object --bucket "$CLOUDFLARE_R2_BUCKET" --key "$key" \
              --endpoint-url "$r2_endpoint" \
              >"dist/state/probes/${name}.stdout" 2>"dist/state/probes/${name}.stderr"
            rc=$?
            set -e
            node scripts/updater/promotion-transaction.mjs classify-probe \
              --provider r2 --key "$key" --exit-code "$rc" \
              --stdout "dist/state/probes/${name}.stdout" \
              --stderr "dist/state/probes/${name}.stderr" \
              --output "dist/state/probes/${name}.json"
          }
          probe_oss() {
            local key="$1" name="$2" rc
            set +e
            ossutil api head-object --bucket "$ALIYUN_OSS_BUCKET" --key "$key" \
              --endpoint "$oss_endpoint" --region "$ALIYUN_REGION" \
              --output-format json --quiet \
              >"dist/state/probes/${name}.stdout" 2>"dist/state/probes/${name}.stderr"
            rc=$?
            set -e
            node scripts/updater/promotion-transaction.mjs classify-probe \
              --provider oss --key "$key" --exit-code "$rc" \
              --stdout "dist/state/probes/${name}.stdout" \
              --stderr "dist/state/probes/${name}.stderr" \
              --output "dist/state/probes/${name}.json"
          }

          probe_r2 "$OPEN_TRANSACTION_KEY" open-r2
          probe_oss "$OPEN_TRANSACTION_KEY" open-oss
          if jq -e '.state == "exists"' dist/state/probes/open-r2.json >/dev/null \
            || jq -e '.state == "exists"' dist/state/probes/open-oss.json >/dev/null; then
            echo "Unfinished updater transaction exists; recover it before any policy writer runs." >&2
            exit 1
          fi

          probe_r2 "$POLICY_KEY" policy-r2

          # Dry-run is deliberately remote read-only, but it exercises both
          # clouds and every candidate key so conflicts fail before mutation.
          if [ "$DRY_RUN" = "true" ]; then
            while IFS=$'\t' read -r file signature_file object_key; do
              probe_oss "$object_key" "candidate-$(basename "$object_key")"
              probe_oss "${object_key}.sig" "candidate-$(basename "$object_key").sig"
              if jq -e '.state == "exists"' \
                "dist/state/probes/candidate-$(basename "$object_key").json" >/dev/null; then
                ossutil cp "oss://${ALIYUN_OSS_BUCKET}/${object_key}" \
                  "dist/state/dry-$(basename "$object_key")" --force \
                  --endpoint "$oss_endpoint" --region "$ALIYUN_REGION"
                cmp "dist/candidate/${file}" "dist/state/dry-$(basename "$object_key")"
              fi
              if jq -e '.state == "exists"' \
                "dist/state/probes/candidate-$(basename "$object_key").sig.json" >/dev/null; then
                ossutil cp "oss://${ALIYUN_OSS_BUCKET}/${object_key}.sig" \
                  "dist/state/dry-$(basename "$object_key").sig" --force \
                  --endpoint "$oss_endpoint" --region "$ALIYUN_REGION"
                cmp "dist/candidate/${signature_file}" \
                  "dist/state/dry-$(basename "$object_key").sig"
              fi
            done < <(jq -r '.assets[] | [.file, .signatureFile, .objectKey] | @tsv' \
              dist/candidate/candidate.json)
            manifest_key="$(jq -r .manifestKey dist/candidate/candidate.json)"
            probe_oss "$manifest_key" candidate-manifest-oss
            probe_r2 "$manifest_key" candidate-manifest-r2
            if jq -e '.state == "exists"' dist/state/probes/candidate-manifest-oss.json >/dev/null; then
              ossutil cp "oss://${ALIYUN_OSS_BUCKET}/${manifest_key}" \
                dist/state/dry-manifest-oss.json --force \
                --endpoint "$oss_endpoint" --region "$ALIYUN_REGION"
              cmp dist/candidate/latest.json dist/state/dry-manifest-oss.json
            fi
            if jq -e '.state == "exists"' dist/state/probes/candidate-manifest-r2.json >/dev/null; then
              aws s3 cp "s3://${CLOUDFLARE_R2_BUCKET}/${manifest_key}" \
                dist/state/dry-manifest-r2.json --endpoint-url "$r2_endpoint"
              cmp dist/candidate/latest.json dist/state/dry-manifest-r2.json
            fi
          fi

      - name: Build logical CAS proposal
        if: steps.remote_preflight.outputs.committed_same_request != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET || vars.ALIYUN_OSS_BUCKET || 'mita-static' }}
          PHASE: ${{ inputs.phase }}
          FROM_VERSION: ${{ inputs.from_version }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          ROLLOUT: ${{ inputs.rollout }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p dist/state
          r2_endpoint="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          policy_state="$(jq -r .state dist/state/probes/policy-r2.json)"
          if [ "$policy_state" = "exists" ]; then
            aws s3 cp "s3://${CLOUDFLARE_R2_BUCKET}/${POLICY_KEY}" \
              dist/state/current-policy.json --endpoint-url "$r2_endpoint"
            touch dist/state/current-policy.exists
          elif [ "$policy_state" != "absent" ]; then
            echo "Unclassified R2 policy state" >&2
            exit 1
          fi
          prepare_args=(
            --candidate dist/candidate/candidate.json
            --policy dist/state/current-policy.json
            --phase "$PHASE"
            --from-version "$FROM_VERSION"
            --expected-current "$EXPECTED_CURRENT"
            --rollout "$ROLLOUT"
            --promoted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --smoke-evidence dist/state/verified-smoke.json
            --health-evidence dist/state/verified-health.json
            --output dist/state/next-policy.json
          )
          node scripts/updater/prepare-promotion.mjs "${prepare_args[@]}"
          node scripts/updater/legacy-manifest-policy.mjs validate-promotion \
            --candidate dist/candidate/candidate.json \
            --manifest dist/candidate/latest.json \
            --current-policy dist/state/current-policy.json \
            --next-policy dist/state/next-policy.json
          cat dist/state/next-policy.json

      - name: Publish with rollback protection
        if: >-
          inputs.dry_run != true &&
          steps.remote_preflight.outputs.committed_same_request != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET || vars.ALIYUN_OSS_BUCKET || 'mita-static' }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          ROLLOUT_SALT: ${{ secrets.BIYAN_UPDATER_ROLLOUT_SALT }}
          PHASE: ${{ inputs.phase }}
          FROM_VERSION: ${{ inputs.from_version }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main"
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse refs/remotes/origin/mita-main)"
          aliyun configure set \
            --profile release \
            --mode AK \
            --region "$ALIYUN_REGION" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"
          bash scripts/updater/run-promotion-transaction.sh

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-promotion-${{ inputs.tag }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/release.json
            dist/smoke-run.json
            dist/candidate/candidate.json
            dist/candidate/latest.json
            dist/state/*.json
            dist/state/RECOVERY_COMMANDS.sh
            dist/state/probes/*
            dist/state/snapshots/*
            dist/state/ledger-cleanup/*
            dist/state/terminal-recovery/*
            dist/state/terminal-recovery/backups/*
            dist/state/terminal-recovery/live/*
