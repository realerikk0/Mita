name: Desktop Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build, for example v0.6.637"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "true"

jobs:
  preflight:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      published_at: ${{ steps.release.outputs.published_at }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      trusted_main_commit: ${{ steps.release.outputs.trusted_main_commit }}
      migration_phase: ${{ steps.release.outputs.migration_phase }}
      data_schema: ${{ steps.release.outputs.data_schema }}
    steps:
      - name: Checkout protected release harness
        uses: actions/checkout@v4
        with:
          ref: mita-main
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact release target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve immutable release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$WORKFLOW_REF" != "refs/heads/mita-main" ]; then
            echo "Manual candidate dispatch must use protected mita-main" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be an exact semantic version prefixed with v" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          git -C harness fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          checkout_head="$(git -C harness rev-parse HEAD)"
          live_main="$(git -C harness rev-parse refs/remotes/origin/mita-main)"
          if [ "$checkout_head" != "$live_main" ]; then
            echo "Trusted release harness $checkout_head is not live origin/mita-main $live_main" >&2
            exit 1
          fi
          source_commit="$(git -C harness rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$source_commit" = "$(git -C target rev-parse HEAD)"
          test "$source_commit" = "$(git -C target rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git -C harness merge-base --is-ancestor \
            "$source_commit" refs/remotes/origin/mita-main
          jq -e '
            .schema == 1
            and (.migrationPhase == "A" or .migrationPhase == "B" or .migrationPhase == "C")
            and ((.migrationPhase == "A" and .dataSchema == 1)
              or (.migrationPhase == "B" and .dataSchema == 2)
              or (.migrationPhase == "C" and .dataSchema == 3))
          ' target/biyan-release.json >/dev/null
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "published_at=$(git -C target show -s --format=%cI "$source_commit")"
            echo "source_commit=$source_commit"
            echo "trusted_main_commit=$live_main"
            echo "migration_phase=$(jq -r .migrationPhase target/biyan-release.json)"
            echo "data_schema=$(jq -r .dataSchema target/biyan-release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact tag with protected release policy
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          TRUSTED_MAIN: ${{ steps.release.outputs.trusted_main_commit }}
        run: |
          node harness/scripts/ci/verify-release-target.mjs \
            --harness-root harness \
            --release-tag "$RELEASE_TAG" \
            --target-root target \
            --source-commit "$SOURCE_COMMIT" \
            --trusted-main "$TRUSTED_MAIN"

      - name: Test protected release policy contracts
        working-directory: harness
        run: |
          node --test scripts/ci/__tests__/release-policy.test.mjs
          node --test scripts/ci/__tests__/verify-release-target.test.mjs

  quality-gate:
    name: Run candidate lint and test suites
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Rust and Tauri system dependencies
        run: |
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            webkit2gtk-driver

      - name: Run lint, TypeScript tests, and Rust tests
        run: make test

      - name: Test updater candidate, promotion, and routing contracts
        run: node --test scripts/updater/__tests__/updater.test.mjs

  build-macos:
    name: Build signed macOS candidate
    runs-on: macos-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust targets
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NOTARIZE_P8_BASE64: ${{ secrets.NOTARIZE_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY NOTARIZE_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$NOTARIZE_P8_BASE64" | base64 --decode > /tmp/notary-key.p8
          chmod 600 /tmp/notary-key.p8

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.CODE_SIGN_P12_PASSWORD }}

      - name: Revalidate protected main before macOS build mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before macOS build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before macOS build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APPLE_CERTIFICATE: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGN_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: LILYN DYNAMICS (7NZP53ZJ4D)"
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify macOS candidate
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node harness/scripts/verify-macos-candidate.mjs \
            --repo-root . \
            --app "src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app" \
            --dmg "src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_${VERSION}_universal.dmg" \
            --version "$VERSION" \
            --signature production

      - name: Notarize and verify DMGs
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before notarization; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before notarization; refusing mixed-source candidate" >&2
            exit 1
          fi
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg)
          [ "${#dmgs[@]}" -gt 0 ] || { echo "No Biyan DMG found" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app

      - name: Revalidate protected main before macOS artifact mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before macOS artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before macOS artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-macos-universal-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz.sig

  build-windows:
    name: Build signed Windows candidate
    runs-on: windows-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust and GNU make
        shell: pwsh
        run: |
          rustup default stable
          choco install make -y --no-progress

      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION" --windows

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Revalidate protected main before Windows build mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Windows build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Windows build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify Biyan artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe"
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe.sig"
          test -f "src-tauri/target/release/bundle/msi/Biyan_${VERSION}_x64_en-US.msi"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle

      - name: Verify extracted Windows candidate
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          & ./harness/scripts/ci/verify-windows-candidate.ps1 `
            -Exe "$bundle/nsis/Biyan_$env:VERSION`_x64-setup.exe" `
            -Msi "$bundle/msi/Biyan_$env:VERSION`_x64_en-US.msi" `
            -Version $env:VERSION

      - name: Revalidate protected main before Windows artifact mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Windows artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Windows artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-windows-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/Biyan_*.exe
            src-tauri/target/release/bundle/nsis/Biyan_*.exe.sig
            src-tauri/target/release/bundle/msi/Biyan_*.msi

  build-linux:
    name: Build signed Linux candidate
    runs-on: ubuntu-22.04
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            libappindicator3-dev

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Revalidate protected main before Linux build mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Linux build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Linux build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_TRAY: libappindicator3
        run: make build

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify Biyan artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage"
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage.sig"
          test -f "src-tauri/target/release/bundle/deb/Biyan_${VERSION}_amd64.deb"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle
          appimage="$(realpath "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage")"
          deb="$(realpath "src-tauri/target/release/bundle/deb/Biyan_${VERSION}_amd64.deb")"
          chmod +x "$appimage"
          extract_root="$(mktemp -d)"
          deb_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root" "$deb_root"' EXIT
          (
            cd "$extract_root"
            "$appimage" --appimage-extract >/dev/null
          )
          dpkg-deb --extract "$deb" "$deb_root"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root "$extract_root/squashfs-root"
          node harness/scripts/ci/candidate-content-policy.mjs \
            --root "$extract_root/squashfs-root"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root "$deb_root"
          node harness/scripts/ci/candidate-content-policy.mjs \
            --root "$deb_root"

      - name: Revalidate protected main before Linux artifact mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Linux artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Linux artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload Linux candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-linux-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage.sig
            src-tauri/target/release/bundle/deb/Biyan_*.deb

  package-candidate:
    name: Package immutable updater candidate
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux]
    environment: release-distribution
    steps:
      - name: Checkout protected release harness
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked Tauri signer
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable --mode=skip-builds

      - name: Download signed candidates
        uses: actions/download-artifact@v4
        with:
          path: dist/builds

      - name: Build canonical candidate manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MIGRATION_PHASE: ${{ needs.preflight.outputs.migration_phase }}
          DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          ASSET_BASE_URL: ${{ vars.BIYAN_UPDATER_ASSET_BASE_URL || 'https://static.mitapp.cn' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/updater/build-candidate.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --artifacts-dir dist/builds \
            --output-dir dist/updater-candidate \
            --asset-base-url "$ASSET_BASE_URL" \
            --published-at "$PUBLISHED_AT" \
            --source-commit "$SOURCE_COMMIT" \
            --migration-phase "$MIGRATION_PHASE" \
            --data-schema "$DATA_SCHEMA"
          node scripts/ci/verify-release-policy.mjs --artifact-root dist/updater-candidate
          yarn tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            dist/updater-candidate/candidate.json
          (
            cd dist/updater-candidate
            sha256sum Biyan* candidate.json candidate.json.sig latest.json > SHA256SUMS
          )

      - name: Revalidate protected main before updater artifact mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before updater artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before updater artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload updater candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-updater-candidate-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: dist/updater-candidate/*

  draft-release:
    name: Create draft release without promoting stable
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux, package-candidate]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        run: |
          node scripts/release-distribution/build-release-notes.mjs \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --output dist/release-notes.md

      - name: Require a fresh draft release slot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            >"$RUNNER_TEMP/existing-release.json" \
            2>"$RUNNER_TEMP/release-probe.err"; then
            echo "A release already exists for $RELEASE_TAG; refusing to reuse its assets" >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-probe.err"; then
            cat "$RUNNER_TEMP/release-probe.err" >&2
            echo "Could not prove the release slot is absent" >&2
            exit 1
          fi

      - name: Revalidate protected main before draft release mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before draft release creation; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before draft release creation; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Create draft candidate release
        uses: softprops/action-gh-release@v2
        with:
          name: Biyan ${{ needs.preflight.outputs.tag }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.source_commit }}
          draft: true
          prerelease: false
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/biyan-updater-candidate-*/*

      - name: Verify exact draft release
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved while creating the draft release" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved while creating the draft release" >&2
            exit 1
          fi
          expected_assets="$(
            printf '%s\n' \
              "Biyan_${VERSION}_universal.dmg" \
              "Biyan.app.tar.gz" \
              "Biyan.app.tar.gz.sig" \
              "Biyan_${VERSION}_x64-setup.exe" \
              "Biyan_${VERSION}_x64-setup.exe.sig" \
              "Biyan_${VERSION}_x64_en-US.msi" \
              "Biyan_${VERSION}_amd64.AppImage" \
              "Biyan_${VERSION}_amd64.AppImage.sig" \
              "Biyan_${VERSION}_amd64.deb" \
              "candidate.json" \
              "candidate.json.sig" \
              "latest.json" \
              "SHA256SUMS" |
              jq -R . |
              jq -s 'sort'
          )"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            >"$RUNNER_TEMP/draft-release.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected "$expected_assets" '
              .tag_name == $tag
              and .draft == true
              and .prerelease == false
              and (([.assets[].name] | sort) == $expected)
            ' "$RUNNER_TEMP/draft-release.json" >/dev/null
