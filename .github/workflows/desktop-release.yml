name: Desktop Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact terminal release tag pinned by protected policy: v0.6.648"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "true"

jobs:
  tag-cut:
    name: Cut or verify exact immutable release tag
    runs-on: ubuntu-latest
    environment: release-distribution
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      source_commit: ${{ steps.tag.outputs.source_commit }}
      trusted_main_commit: ${{ steps.tag.outputs.trusted_main_commit }}
    steps:
      - name: Cut or verify exact lightweight release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_REF" != "refs/heads/mita-main" ]; then
            echo "Candidate dispatch must use protected mita-main" >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dispatch head is not a full commit SHA: $WORKFLOW_SHA" >&2
            exit 1
          fi

          live_main="$(
            gh api "repos/$GITHUB_REPOSITORY/branches/mita-main" --jq '.commit.sha'
          )"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Live mita-main is not a full commit SHA: $live_main" >&2
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$live_main" ]; then
            echo "Dispatch head $WORKFLOW_SHA is not live mita-main $live_main" >&2
            exit 1
          fi

          policy_json="$RUNNER_TEMP/release-train-policy.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/ci/release-train-policy.json?ref=$live_main" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$policy_json"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            '
              (keys | sort)
                == ["activeTerminalRelease", "activeTrain", "schema", "supersededTerminalReleases", "trains"]
              and .schema == 3
              and .activeTrain == null
              and (.trains | type == "array")
              and ([.trains[] | select(.status == "active")] | length) == 0
              and ([.trains[] | select(.status == "superseded-by-terminal")]
                | length) == 1
              and .trains[-1].status == "superseded-by-terminal"
              and (.supersededTerminalReleases | type == "array")
              and (.supersededTerminalReleases | length) == 2
              and ((.supersededTerminalReleases[0] | keys | sort)
                == ["dataSchema", "migrationPhase", "sourceCommit", "status", "tag", "version"])
              and .supersededTerminalReleases[0].tag == "v0.6.646"
              and .supersededTerminalReleases[0].version == "0.6.646"
              and .supersededTerminalReleases[0].migrationPhase == "C"
              and .supersededTerminalReleases[0].dataSchema == 3
              and .supersededTerminalReleases[0].sourceCommit == "581ebf6b19ef407a9645d0b318792f1012f8f75b"
              and .supersededTerminalReleases[0].status == "blocked-before-publication"
              and ((.supersededTerminalReleases[1] | keys | sort)
                == ["dataSchema", "migrationPhase", "sourceCommit", "status", "tag", "version"])
              and .supersededTerminalReleases[1].tag == "v0.6.647"
              and .supersededTerminalReleases[1].version == "0.6.647"
              and .supersededTerminalReleases[1].migrationPhase == "C"
              and .supersededTerminalReleases[1].dataSchema == 3
              and .supersededTerminalReleases[1].sourceCommit == "ef963bc606366220db4589352afb25aa7d1785bf"
              and .supersededTerminalReleases[1].status == "blocked-before-publication"
              and (.activeTerminalRelease | type == "object")
              and ((.activeTerminalRelease | keys | sort)
                == ["dataSchema", "migrationPhase", "sourceCommit", "tag", "version"])
              and .activeTerminalRelease.tag == $tag
              and .activeTerminalRelease.tag
                == ("v" + .activeTerminalRelease.version)
              and .activeTerminalRelease.tag == "v0.6.648"
              and .activeTerminalRelease.version == "0.6.648"
              and .activeTerminalRelease.migrationPhase == "C"
              and .activeTerminalRelease.dataSchema == 3
              and (.activeTerminalRelease.sourceCommit
                | test("^[0-9a-f]{40}$"))
            ' \
            "$policy_json" >/dev/null; then
            echo "Release tag is not the exact active terminal policy binding: $RELEASE_TAG" >&2
            exit 1
          fi
          source_commit="$(
            jq -er '.activeTerminalRelease.sourceCommit' "$policy_json"
          )"

          resolved_source="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$source_commit" --jq '.sha'
          )"
          if [ "$resolved_source" != "$source_commit" ]; then
            echo "Approved source did not resolve exactly: $resolved_source" >&2
            exit 1
          fi

          compare_json="$RUNNER_TEMP/tag-cut-compare.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/compare/$source_commit...$live_main" \
            > "$compare_json"
          if ! jq -e \
            --arg source "$source_commit" \
            --arg main "$live_main" \
            '
              .base_commit.sha == $source
              and .merge_base_commit.sha == $source
              and .status == (if $source == $main then "identical" else "ahead" end)
              and .behind_by == 0
            ' \
            "$compare_json" >/dev/null; then
            echo "Approved source $source_commit is not an ancestor of live mita-main $live_main" >&2
            exit 1
          fi

          api_version="2022-11-28"
          tag_endpoint="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          tag_json="$RUNNER_TEMP/tag-cut-current.json"
          read_tag() {
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --output "$tag_json" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: $api_version" \
              "$tag_endpoint"
          }

          status="$(read_tag)"
          case "$status" in
            200)
              if ! jq -e \
                --arg ref "refs/tags/$RELEASE_TAG" \
                --arg source "$source_commit" \
                '
                  .ref == $ref
                  and .object.type == "commit"
                  and .object.sha == $source
                ' \
                "$tag_json" >/dev/null; then
                echo "Existing tag conflicts with approved lightweight ref: $RELEASE_TAG" >&2
                exit 1
              fi
              echo "Exact tag already exists; no mutation required: $RELEASE_TAG"
              ;;
            404)
              request_json="$RUNNER_TEMP/tag-cut-request.json"
              created_json="$RUNNER_TEMP/tag-cut-created.json"
              jq -n \
                --arg ref "refs/tags/$RELEASE_TAG" \
                --arg sha "$source_commit" \
                '{ref: $ref, sha: $sha}' \
                > "$request_json"
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                --input "$request_json" \
                > "$created_json"
              jq -e \
                --arg ref "refs/tags/$RELEASE_TAG" \
                --arg source "$source_commit" \
                '
                  .ref == $ref
                  and .object.type == "commit"
                  and .object.sha == $source
                ' \
                "$created_json" >/dev/null
              ;;
            *)
              echo "Unexpected tag lookup status $status for $RELEASE_TAG" >&2
              jq . "$tag_json" >&2 || true
              exit 1
              ;;
          esac

          status="$(read_tag)"
          if [ "$status" != "200" ] \
            || ! jq -e \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg source "$source_commit" \
              '
                .ref == $ref
                and .object.type == "commit"
                and .object.sha == $source
              ' \
              "$tag_json" >/dev/null; then
            echo "Exact tag readback failed for $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "version=${RELEASE_TAG#v}"
            echo "tag=$RELEASE_TAG"
            echo "source_commit=$source_commit"
            echo "trusted_main_commit=$live_main"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    needs: tag-cut
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      published_at: ${{ steps.release.outputs.published_at }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      trusted_main_commit: ${{ steps.release.outputs.trusted_main_commit }}
      migration_phase: ${{ steps.release.outputs.migration_phase }}
      data_schema: ${{ steps.release.outputs.data_schema }}
    steps:
      - name: Checkout protected release harness
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-cut.outputs.trusted_main_commit }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact release target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-cut.outputs.tag }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve immutable release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.tag-cut.outputs.tag }}
          EXPECTED_SOURCE: ${{ needs.tag-cut.outputs.source_commit }}
          EXPECTED_MAIN: ${{ needs.tag-cut.outputs.trusted_main_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be an exact semantic version prefixed with v" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          git -C harness fetch --force --no-tags origin \
            "+refs/heads/mita-main:refs/remotes/origin/mita-main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          checkout_head="$(git -C harness rev-parse HEAD)"
          live_main="$(git -C harness rev-parse refs/remotes/origin/mita-main)"
          if [ "$checkout_head" != "$EXPECTED_MAIN" ] \
            || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "Trusted release harness is no longer the exact dispatch-time mita-main" >&2
            exit 1
          fi
          source_commit="$(git -C harness rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$source_commit" = "$EXPECTED_SOURCE"
          test "$source_commit" = "$(git -C target rev-parse HEAD)"
          test "$source_commit" = "$(git -C target rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git -C harness merge-base --is-ancestor \
            "$source_commit" refs/remotes/origin/mita-main
          jq -e '
            .schema == 1
            and (.migrationPhase == "A" or .migrationPhase == "B" or .migrationPhase == "C")
            and ((.migrationPhase == "A" and .dataSchema == 1)
              or (.migrationPhase == "B" and .dataSchema == 2)
              or (.migrationPhase == "C" and .dataSchema == 3))
          ' target/biyan-release.json >/dev/null
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "published_at=$(git -C target show -s --format=%cI "$source_commit")"
            echo "source_commit=$source_commit"
            echo "trusted_main_commit=$live_main"
            echo "migration_phase=$(jq -r .migrationPhase target/biyan-release.json)"
            echo "data_schema=$(jq -r .dataSchema target/biyan-release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact tag with protected release policy
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          TRUSTED_MAIN: ${{ steps.release.outputs.trusted_main_commit }}
        run: |
          node harness/scripts/ci/verify-release-target.mjs \
            --harness-root harness \
            --release-tag "$RELEASE_TAG" \
            --target-root target \
            --source-commit "$SOURCE_COMMIT" \
            --trusted-main "$TRUSTED_MAIN"

      - name: Test protected release policy contracts
        working-directory: harness
        run: |
          node --test scripts/ci/__tests__/release-policy.test.mjs
          node --test scripts/ci/__tests__/verify-release-target.test.mjs

  quality-gate:
    name: Run candidate lint and test suites
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Rust and Tauri system dependencies
        run: |
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            webkit2gtk-driver

      - name: Run lint, TypeScript tests, and Rust tests
        run: make test

      - name: Test updater candidate, promotion, and routing contracts
        run: node --test scripts/updater/__tests__/updater.test.mjs

  build-macos:
    name: Build signed macOS candidate
    runs-on: macos-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust targets
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NOTARIZE_P8_BASE64: ${{ secrets.NOTARIZE_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY NOTARIZE_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$NOTARIZE_P8_BASE64" | base64 --decode > /tmp/notary-key.p8
          chmod 600 /tmp/notary-key.p8

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.CODE_SIGN_P12_PASSWORD }}

      - name: Revalidate protected main before macOS build mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before macOS build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before macOS build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APPLE_CERTIFICATE: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGN_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: LILYN DYNAMICS (7NZP53ZJ4D)"
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify macOS candidate
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node harness/scripts/verify-macos-candidate.mjs \
            --repo-root . \
            --app "src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app" \
            --dmg "src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_${VERSION}_universal.dmg" \
            --version "$VERSION" \
            --signature production

      - name: Notarize and verify DMGs
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before notarization; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before notarization; refusing mixed-source candidate" >&2
            exit 1
          fi
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg)
          [ "${#dmgs[@]}" -gt 0 ] || { echo "No Biyan DMG found" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app

      - name: Revalidate protected main before macOS artifact mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before macOS artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before macOS artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-macos-universal-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz.sig

  build-windows:
    name: Build signed Windows candidate
    runs-on: windows-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust and GNU make
        shell: pwsh
        run: |
          rustup default stable
          choco install make -y --no-progress

      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION" --windows

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Revalidate protected main before Windows build mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Windows build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Windows build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify Biyan artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe"
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe.sig"
          test -f "src-tauri/target/release/bundle/msi/Biyan_${VERSION}_x64_en-US.msi"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle

      - name: Verify extracted Windows candidate
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          & ./harness/scripts/ci/verify-windows-candidate.ps1 `
            -Exe "$bundle/nsis/Biyan_$env:VERSION`_x64-setup.exe" `
            -Msi "$bundle/msi/Biyan_$env:VERSION`_x64_en-US.msi" `
            -Version $env:VERSION `
            -GeneratedNsis 'src-tauri/target/release/nsis/x64/installer.nsi'

      - name: Revalidate protected main before Windows artifact mutation
        shell: bash
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Windows artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Windows artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-windows-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/Biyan_*.exe
            src-tauri/target/release/bundle/nsis/Biyan_*.exe.sig
            src-tauri/target/release/bundle/msi/Biyan_*.msi

  build-linux:
    name: Build signed Linux candidate
    runs-on: ubuntu-22.04
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            libappindicator3-dev

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Revalidate protected main before Linux build mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Linux build; retry from the new trusted harness" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Linux build; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_TRAY: libappindicator3
        run: make build

      - name: Re-sign final Linux AppImage
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage="src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage"
          test -f "$appimage"
          rm -f "$appimage.sig"
          yarn tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$appimage"
          test -s "$appimage.sig"

      - name: Checkout protected candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          path: harness
          persist-credentials: false

      - name: Verify Biyan artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage"
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage.sig"
          test -f "src-tauri/target/release/bundle/deb/Biyan_${VERSION}_amd64.deb"
          public_key="$(
            jq -er '.plugins.updater.pubkey | select(type == "string" and length > 0)' \
              harness/src-tauri/tauri.conf.json
          )"
          node harness/scripts/updater/verify-updater-asset-signature.mjs \
            --asset "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage" \
            --signature "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage.sig" \
            --public-key "$public_key" \
            --label linux-x86_64
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle
          appimage="$(realpath "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage")"
          deb="$(realpath "src-tauri/target/release/bundle/deb/Biyan_${VERSION}_amd64.deb")"
          chmod +x "$appimage"
          extract_root="$(mktemp -d)"
          deb_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root" "$deb_root"' EXIT
          (
            cd "$extract_root"
            "$appimage" --appimage-extract >/dev/null
          )
          dpkg-deb --extract "$deb" "$deb_root"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root "$extract_root/squashfs-root"
          node harness/scripts/ci/candidate-content-policy.mjs \
            --root "$extract_root/squashfs-root"
          node harness/scripts/ci/candidate-path-policy.mjs \
            --root "$deb_root"
          node harness/scripts/ci/candidate-content-policy.mjs \
            --root "$deb_root"

      - name: Revalidate protected main before Linux artifact mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before Linux artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before Linux artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload Linux candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-linux-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage.sig
            src-tauri/target/release/bundle/deb/Biyan_*.deb

  package-candidate:
    name: Package immutable updater candidate
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux]
    environment: release-distribution
    permissions:
      actions: read
      contents: read
    outputs:
      updater_artifact_id: ${{ steps.updater.outputs.artifact-id }}
      updater_artifact_digest: ${{ steps.updater-metadata.outputs.artifact_digest }}
      updater_artifact_size: ${{ steps.updater-metadata.outputs.artifact_size }}
    steps:
      - name: Checkout protected release harness
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked Tauri signer
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable --mode=skip-build

      - name: Download signed candidates
        uses: actions/download-artifact@v4
        with:
          path: dist/builds

      - name: Build canonical candidate manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MIGRATION_PHASE: ${{ needs.preflight.outputs.migration_phase }}
          DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          ASSET_BASE_URL: ${{ vars.BIYAN_UPDATER_ASSET_BASE_URL || 'https://static.mitapp.cn' }}
        run: |
          node scripts/updater/build-candidate.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --artifacts-dir dist/builds \
            --output-dir dist/updater-candidate \
            --asset-base-url "$ASSET_BASE_URL" \
            --published-at "$PUBLISHED_AT" \
            --source-commit "$SOURCE_COMMIT" \
            --migration-phase "$MIGRATION_PHASE" \
            --data-schema "$DATA_SCHEMA"
          node scripts/ci/verify-release-policy.mjs --artifact-root dist/updater-candidate

      - name: Sign canonical candidate manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            dist/updater-candidate/candidate.json

      - name: Verify signed candidate and write hashes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          node scripts/updater/verify-candidate.mjs \
            dist/updater-candidate \
            "$TAG"
          (
            cd dist/updater-candidate
            sha256sum Biyan* candidate.json candidate.json.sig latest.json > SHA256SUMS
          )

      - name: Revalidate protected main before updater artifact mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before updater artifact upload; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before updater artifact upload; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Upload updater candidate
        id: updater
        uses: actions/upload-artifact@v4
        with:
          name: biyan-updater-candidate-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: dist/updater-candidate/*

      - name: Authenticate uploaded updater artifact
        id: updater-metadata
        env:
          ACTION_ARTIFACT_DIGEST: ${{ steps.updater.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.updater.outputs.artifact-id }}
          ARTIFACT_NAME: biyan-updater-candidate-${{ needs.preflight.outputs.version }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ACTION_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact_digest="sha256:$ACTION_ARTIFACT_DIGEST"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            >"$RUNNER_TEMP/updater-artifact.json"
          jq -e \
            --arg digest "$artifact_digest" \
            --arg head "$CURRENT_SHA" \
            --arg name "$ARTIFACT_NAME" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson run_id "$CURRENT_RUN_ID" '
              .id == $artifact_id
              and .name == $name
              and .expired == false
              and .size_in_bytes > 0
              and .digest == $digest
              and .workflow_run.id == $run_id
              and .workflow_run.head_sha == $head
            ' "$RUNNER_TEMP/updater-artifact.json" >/dev/null
          artifact_size="$(
            jq -er '.size_in_bytes | select(. > 0)' \
              "$RUNNER_TEMP/updater-artifact.json"
          )"
          echo "artifact_digest=$artifact_digest" >>"$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >>"$GITHUB_OUTPUT"

  draft-release:
    name: Create draft release without promoting stable
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux, package-candidate]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_main_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact updater archive by authenticated ID
        env:
          ARTIFACT_DIGEST: ${{ needs.package-candidate.outputs.updater_artifact_digest }}
          ARTIFACT_ID: ${{ needs.package-candidate.outputs.updater_artifact_id }}
          ARTIFACT_SIZE: ${{ needs.package-candidate.outputs.updater_artifact_size }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          install -d -m 700 dist/recovered-updater
          archive="dist/recovered-updater/updater.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            >"$archive"
          test "$(stat -c '%s' "$archive")" = "$ARTIFACT_SIZE"
          actual_digest="sha256:$(sha256sum "$archive" | awk '{ print $1 }')"
          if [ "$actual_digest" != "$ARTIFACT_DIGEST" ]; then
            echo "Updater artifact archive digest mismatch" >&2
            exit 1
          fi

      - name: Extract exact updater candidate
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/ci/extract-release-candidate-recovery.py \
            --updater-archive dist/recovered-updater/updater.zip \
            --output-dir "dist/biyan-updater-candidate-$VERSION" \
            --version "$VERSION"

      - name: Generate release notes
        run: |
          node scripts/release-distribution/build-release-notes.mjs \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --output dist/release-notes.md

      - name: Require a fresh draft release slot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            >"$RUNNER_TEMP/existing-release-pages.json"
          jq -e \
            --arg tag "$RELEASE_TAG" '
              [.[][] | select(.tag_name == $tag)] | length == 0
            ' "$RUNNER_TEMP/existing-release-pages.json" >/dev/null

      - name: Revalidate protected main before draft release mutation
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved before draft release creation; retry safely" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved before draft release creation; refusing mixed-source candidate" >&2
            exit 1
          fi

      - name: Atomically create an empty Draft
        env:
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg target "$EXPECTED_SOURCE" \
            --arg name "Biyan $RELEASE_TAG" \
            --rawfile body dist/release-notes.md '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: true,
              prerelease: false,
              generate_release_notes: false
            }' >"$RUNNER_TEMP/create-draft-request.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input "$RUNNER_TEMP/create-draft-request.json" \
            >"$RUNNER_TEMP/created-draft.json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" '
              (.id | type == "number" and . > 0)
              and .name == ("Biyan " + $tag)
              and .tag_name == $tag
              and .draft == true
              and .prerelease == false
              and .published_at == null
              and (.assets | length == 0)
              and (.html_url |
                test(
                  "^https://github.com/" + $repo +
                  "/releases/tag/untagged-[0-9a-f]{20}$"
                ))
              and (.upload_url |
                startswith(
                  "https://uploads.github.com/repos/" + $repo + "/releases/"
                ))
            ' "$RUNNER_TEMP/created-draft.json" >/dev/null
          release_id="$(
            jq -er '.id | select(type == "number" and . > 0)' \
              "$RUNNER_TEMP/created-draft.json"
          )"
          draft_visible=0
          for attempt in {1..15}; do
            if ! gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              >"$RUNNER_TEMP/post-create-release-pages.json"; then
              echo "Unable to enumerate the newly created Draft" >&2
              exit 1
            fi
            matching_ids="$(
              jq -ce \
                --arg tag "$RELEASE_TAG" '
                  [.[][] | select(.tag_name == $tag) | .id]
                ' "$RUNNER_TEMP/post-create-release-pages.json"
            )"
            if [ "$matching_ids" = "[$release_id]" ]; then
              draft_visible=1
              break
            fi
            if [ "$matching_ids" != "[]" ]; then
              echo "Draft readback returned a conflicting release ID" >&2
              exit 1
            fi
            if [ "$attempt" -lt 15 ]; then
              sleep 2
            fi
          done
          if [ "$draft_visible" -ne 1 ]; then
            echo "Newly created Draft did not become visible" >&2
            exit 1
          fi

      - name: Upload exact assets only to the newly created Draft ID
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release_id="$(
            jq -er '.id | select(type == "number" and . > 0)' \
              "$RUNNER_TEMP/created-draft.json"
          )"
          draft_slug="$(
            jq -er \
              --arg repo "$GITHUB_REPOSITORY" '
                .html_url |
                capture(
                  "^https://github.com/" + $repo +
                  "/releases/tag/(?<slug>untagged-[0-9a-f]{20})$"
                ).slug
              ' "$RUNNER_TEMP/created-draft.json"
          )"
          asset_dir="dist/biyan-updater-candidate-$VERSION"
          assets=(
            "Biyan_${VERSION}_universal.dmg"
            "Biyan.app.tar.gz"
            "Biyan.app.tar.gz.sig"
            "Biyan_${VERSION}_x64-setup.exe"
            "Biyan_${VERSION}_x64-setup.exe.sig"
            "Biyan_${VERSION}_x64_en-US.msi"
            "Biyan_${VERSION}_amd64.AppImage"
            "Biyan_${VERSION}_amd64.AppImage.sig"
            "Biyan_${VERSION}_amd64.deb"
            "candidate.json"
            "candidate.json.sig"
            "latest.json"
            "SHA256SUMS"
          )
          for index in "${!assets[@]}"; do
            name="${assets[$index]}"
            file="$asset_dir/$name"
            test -f "$file"
            size="$(stat -c '%s' "$file")"
            test "$size" -gt 0
            digest="sha256:$(sha256sum "$file" | awk '{ print $1 }')"
            encoded_name="$(jq -rn --arg name "$name" '$name | @uri')"
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
              >"$RUNNER_TEMP/uploaded-asset-$index.json"
            jq -e \
              --arg digest "$digest" \
              --arg draft_slug "$draft_slug" \
              --arg name "$name" \
              --arg repo "$GITHUB_REPOSITORY" \
              --argjson size "$size" '
                .name == $name
                and .state == "uploaded"
                and .size == $size
                and .digest == $digest
                and (.browser_download_url ==
                  ("https://github.com/" + $repo + "/releases/download/" +
                    $draft_slug + "/" + $name))
              ' "$RUNNER_TEMP/uploaded-asset-$index.json" >/dev/null
          done

      - name: Verify exact draft release
        env:
          EXPECTED_MAIN: ${{ needs.preflight.outputs.trusted_main_commit }}
          EXPECTED_SOURCE: ${{ needs.preflight.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/mita-main | awk 'NF == 2 { print $1 }')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]] || [ "$live_main" != "$EXPECTED_MAIN" ]; then
            echo "origin/mita-main moved while creating the draft release" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          live_tag="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ')"
          if [[ ! "$live_tag" =~ ^[0-9a-f]{40}$ ]] || [ "$live_tag" != "$EXPECTED_SOURCE" ]; then
            echo "$RELEASE_TAG moved while creating the draft release" >&2
            exit 1
          fi
          release_id="$(
            jq -er '.id | select(type == "number" and . > 0)' \
              "$RUNNER_TEMP/created-draft.json"
          )"
          draft_slug="$(
            jq -er \
              --arg repo "$GITHUB_REPOSITORY" '
                .html_url |
                capture(
                  "^https://github.com/" + $repo +
                  "/releases/tag/(?<slug>untagged-[0-9a-f]{20})$"
                ).slug
              ' "$RUNNER_TEMP/created-draft.json"
          )"
          asset_dir="dist/biyan-updater-candidate-$VERSION"
          : >"$RUNNER_TEMP/expected-assets.ndjson"
          for file in "$asset_dir"/*; do
            test -f "$file"
            name="$(basename "$file")"
            size="$(stat -c '%s' "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{ print $1 }')"
            jq -n \
              --arg digest "$digest" \
              --arg name "$name" \
              --argjson size "$size" \
              '{ name: $name, size: $size, digest: $digest }' \
              >>"$RUNNER_TEMP/expected-assets.ndjson"
          done
          expected_assets="$(
            jq -s 'sort_by(.name)' "$RUNNER_TEMP/expected-assets.ndjson"
          )"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            >"$RUNNER_TEMP/draft-release.json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg draft_slug "$draft_slug" \
            --argjson release_id "$release_id" \
            --argjson expected "$expected_assets" '
              .id == $release_id
              and .name == ("Biyan " + $tag)
              and .tag_name == $tag
              and .draft == true
              and .prerelease == false
              and .published_at == null
              and (.html_url ==
                ("https://github.com/" + $repo + "/releases/tag/" +
                  $draft_slug))
              and (([.assets[] | { name, size, digest }] |
                sort_by(.name)) == $expected)
              and all(.assets[];
                .state == "uploaded"
                and .size > 0
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.browser_download_url |
                  startswith(
                    "https://github.com/" + $repo +
                    "/releases/download/" + $draft_slug + "/"
                  ))
              )
            ' "$RUNNER_TEMP/draft-release.json" >/dev/null
          gh api \
            --paginate \
            --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            >"$RUNNER_TEMP/final-release-pages.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson release_id "$release_id" '
              [.[][] | select(.tag_name == $tag) | .id] == [$release_id]
            ' "$RUNNER_TEMP/final-release-pages.json" >/dev/null
