name: Desktop Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build, for example v0.6.637"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-candidate-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4196"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "true"

jobs:
  preflight:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      published_at: ${{ steps.release.outputs.published_at }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      migration_phase: ${{ steps.release.outputs.migration_phase }}
      data_schema: ${{ steps.release.outputs.data_schema }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve immutable release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be an exact semantic version prefixed with v" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"
          node scripts/release-version.mjs check "$version"
          jq -e '
            .schema == 1
            and (.migrationPhase == "A" or .migrationPhase == "B" or .migrationPhase == "C")
            and ((.migrationPhase == "A" and .dataSchema == 1)
              or (.migrationPhase == "B" and .dataSchema == 2)
              or (.migrationPhase == "C" and .dataSchema == 3))
          ' biyan-release.json >/dev/null
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "published_at=$(git show -s --format=%cI HEAD)"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "migration_phase=$(jq -r .migrationPhase biyan-release.json)"
            echo "data_schema=$(jq -r .dataSchema biyan-release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release safety policy
        run: node scripts/ci/verify-release-policy.mjs

      - name: Test release policy contracts
        run: node --test scripts/ci/__tests__/release-policy.test.mjs

  quality-gate:
    name: Run candidate lint and test suites
    runs-on: ubuntu-22.04
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Rust and Tauri system dependencies
        run: |
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            webkit2gtk-driver

      - name: Run lint, TypeScript tests, and Rust tests
        run: make test

      - name: Test updater candidate, promotion, and routing contracts
        run: node --test scripts/updater/__tests__/updater.test.mjs

  build-macos:
    name: Build signed macOS candidate
    runs-on: macos-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust targets
        shell: bash
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NOTARIZE_P8_BASE64: ${{ secrets.NOTARIZE_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY NOTARIZE_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$NOTARIZE_P8_BASE64" | base64 --decode > /tmp/notary-key.p8
          chmod 600 /tmp/notary-key.p8

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.CODE_SIGN_P12_PASSWORD }}

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APPLE_CERTIFICATE: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGN_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: LILYN DYNAMICS (7NZP53ZJ4D)"
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Verify macOS candidate
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          make verify-macos-candidate \
            APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app" \
            DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_${VERSION}_universal.dmg" \
            VERSION="$VERSION"

      - name: Notarize and verify DMGs
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/notary-key.p8
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg)
          [ "${#dmgs[@]}" -gt 0 ] || { echo "No Biyan DMG found" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app

      - name: Upload macOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-macos-universal-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Biyan_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Biyan.app.tar.gz.sig

  build-windows:
    name: Build signed Windows candidate
    runs-on: windows-latest
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Setup Rust and GNU make
        shell: pwsh
        run: |
          rustup default stable
          choco install make -y --no-progress

      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION" --windows

      - name: Require Biyan signing material
        shell: bash
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Build app
        shell: bash
        env:
          APP_PATH: "."
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
        run: make build

      - name: Verify Biyan artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe"
          test -f "src-tauri/target/release/bundle/nsis/Biyan_${VERSION}_x64-setup.exe.sig"
          test -f "src-tauri/target/release/bundle/msi/Biyan_${VERSION}_x64_en-US.msi"
          node scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle \
            --runtime-only

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-windows-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/Biyan_*.exe
            src-tauri/target/release/bundle/nsis/Biyan_*.exe.sig
            src-tauri/target/release/bundle/msi/Biyan_*.msi

  build-linux:
    name: Build signed Linux candidate
    runs-on: ubuntu-22.04
    needs: [preflight, quality-gate]
    environment: release-distribution
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 \
            libappindicator3-dev

      - name: Stamp release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Require Biyan signing material
        env:
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in BIYAN_SIGNING_KEY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Build app
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BIYAN_SIGNING_KEY: ${{ secrets.BIYAN_SIGNING_KEY }}
          BIYAN_DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          TAURI_TRAY: libappindicator3
        run: make build

      - name: Verify Biyan artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage"
          test -f "src-tauri/target/release/bundle/appimage/Biyan_${VERSION}_amd64.AppImage.sig"
          test -f "src-tauri/target/release/bundle/deb/Biyan_${VERSION}_amd64.deb"
          node scripts/ci/candidate-path-policy.mjs \
            --root src-tauri/target/release/bundle \
            --runtime-only

      - name: Upload Linux candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-linux-x64-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage
            src-tauri/target/release/bundle/appimage/Biyan_*.AppImage.sig
            src-tauri/target/release/bundle/deb/Biyan_*.deb

  package-candidate:
    name: Package immutable updater candidate
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux]
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Download signed candidates
        uses: actions/download-artifact@v4
        with:
          path: dist/builds

      - name: Build canonical candidate manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MIGRATION_PHASE: ${{ needs.preflight.outputs.migration_phase }}
          DATA_SCHEMA: ${{ needs.preflight.outputs.data_schema }}
          ASSET_BASE_URL: ${{ vars.BIYAN_UPDATER_ASSET_BASE_URL || 'https://static.mitapp.cn' }}
        run: |
          node scripts/updater/build-candidate.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --artifacts-dir dist/builds \
            --output-dir dist/updater-candidate \
            --asset-base-url "$ASSET_BASE_URL" \
            --published-at "$PUBLISHED_AT" \
            --source-commit "$SOURCE_COMMIT" \
            --migration-phase "$MIGRATION_PHASE" \
            --data-schema "$DATA_SCHEMA"
          node scripts/ci/verify-release-policy.mjs --artifact-root dist/updater-candidate
          (
            cd dist/updater-candidate
            sha256sum Biyan* candidate.json latest.json > SHA256SUMS
          )

      - name: Upload updater candidate
        uses: actions/upload-artifact@v4
        with:
          name: biyan-updater-candidate-${{ needs.preflight.outputs.version }}
          if-no-files-found: error
          path: dist/updater-candidate/*

  draft-release:
    name: Create draft release without promoting stable
    runs-on: ubuntu-latest
    needs: [preflight, build-macos, build-windows, build-linux, package-candidate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        run: |
          node scripts/release-distribution/build-release-notes.mjs \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --output dist/release-notes.md

      - name: Create draft candidate release
        uses: softprops/action-gh-release@v2
        with:
          name: Biyan ${{ needs.preflight.outputs.tag }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: true
          prerelease: false
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/biyan-macos-universal-*/*.dmg
            dist/biyan-windows-x64-*/*.msi
            dist/biyan-linux-x64-*/*.deb
            dist/biyan-updater-candidate-*/*
