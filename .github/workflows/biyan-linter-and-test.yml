name: Biyan Linter & Test
on:
  workflow_dispatch:
  schedule:
    # Nightly full CI at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  push:
    branches:
      - mita-main
      - release/**
    paths:
      - '.github/workflows/biyan-linter-and-test.yml'
      - 'web/**'
      - 'joi/**'
      - 'package.json'
      - 'node_modules/**'
      - 'yarn.lock'
      - 'core/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'src-tauri/**'
      - 'web-app/**'
      - '!README.md'
      - 'Makefile'

  pull_request:
    branches:
      - mita-main
      - release/**
    # No paths filter on purpose: the workflow must run on EVERY PR so the
    # required "PR CI Gate" check always reports. With a paths filter a
    # docs-only PR never triggers this workflow, leaving the gate perpetually
    # "expected" and the PR un-mergeable. Cost is controlled by the run_checks
    # scope below — docs-only PRs no-op the Fast PR check and skip heavy jobs.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
      run_checks: ${{ steps.scope.outputs.run_checks }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "full_ci=true"
              echo "run_checks=true"
              echo "changed_files=non-pr event"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          {
            echo 'changed_files<<EOF'
            printf '%s\n' "$changed_files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if grep -E '^(\.github/workflows/|Makefile|package\.json|yarn\.lock|core/|extensions/|scripts/|src-tauri/)' <<< "$changed_files" >/dev/null; then
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_ci=false" >> "$GITHUB_OUTPUT"
          fi

          # run_checks=false only when EVERY changed file is docs/markdown, so a
          # docs-only PR skips lint/test/build yet the Fast PR check still
          # reports success and satisfies the gate. Any non-doc file flips it on.
          if grep -vE '^(docs/|.*\.mdx?$|LICENSE$|\.gitignore$)' <<< "$changed_files" >/dev/null; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

  quick-pr-check:
    name: Fast PR check
    needs: ci-scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Docs-only PRs (run_checks=false) report success without doing any work,
      # so the required Fast PR check + gate pass without wasting CI on a build.
      - name: Skip checks (docs-only change)
        if: needs.ci-scope.outputs.run_checks != 'true'
        run: echo "Docs-only PR — no lint/test/build needed; reporting success."

      - name: Getting the repo
        if: needs.ci-scope.outputs.run_checks == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installing node
        if: needs.ci-scope.outputs.run_checks == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Config Yarn
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn install

      - name: Lint web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn lint

      - name: Test web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn test:web

      - name: Build web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn build:web

  release-safety:
    name: Release safety policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Verify private packages, signing keys, egress, and artifact policy
        run: node scripts/ci/verify-release-policy.mjs

      - name: Test release gate policy contracts
        run: node --test scripts/ci/__tests__/release-policy.test.mjs

      - name: Test updater candidate, promotion, and routing contracts
        run: node --test scripts/updater/__tests__/updater.test.mjs

  base_branch_cov:
    needs: ci-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run test coverage
        run: |
          yarn test:coverage || {
            echo "::warning::Base branch TypeScript coverage failed; continuing without a TS baseline."
            mkdir -p coverage
            printf 'TN:\n' > coverage/lcov.info
          }

      - name: Upload code coverage for ref branch
        uses: actions/upload-artifact@v4
        with:
          name: ref-lcov.info
          path: coverage/lcov.info

  base_branch_rust_cov:
    needs: ci-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Create Tauri resource stubs for CI
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          mkdir -p src-tauri/resources/bin src-tauri/resources/pre-install src-tauri/icons
          mkdir -p src-tauri/resources/ms-playwright
          mkdir -p src-tauri/resources/node_modules/playwright src-tauri/resources/node_modules/playwright-core
          mkdir -p src-tauri/resources/computer-agent-runner
          touch src-tauri/resources/pre-install/.gitkeep
          touch src-tauri/resources/ms-playwright/.gitkeep
          touch src-tauri/resources/node_modules/playwright/.gitkeep
          touch src-tauri/resources/node_modules/playwright-core/.gitkeep
          touch src-tauri/resources/computer-agent-runner/.gitkeep
          touch src-tauri/resources/LICENSE
          touch src-tauri/resources/NOTICE
          touch src-tauri/resources/bin/biyan-cli
          touch src-tauri/resources/bin/biyan-web-research-mcp.mjs
          chmod +x src-tauri/resources/bin/biyan-cli src-tauri/resources/bin/biyan-web-research-mcp.mjs
          for bin in uv bun; do
            touch "src-tauri/resources/bin/${bin}-${TRIPLE}"
            chmod +x "src-tauri/resources/bin/${bin}-${TRIPLE}"
          done
          # Icons are gitignored; generate_context!() requires them at compile time
          for icon in 32x32.png 128x128.png 128x128@2x.png icon.icns icon.ico; do
            [ -f "src-tauri/icons/$icon" ] || cp src-tauri/icons/icon.png "src-tauri/icons/$icon"
          done

      - name: Run Rust test coverage
        run: |
          cargo llvm-cov clean --workspace --manifest-path src-tauri/Cargo.toml
          {
            cargo llvm-cov --no-report --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- --test-threads=1
            cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-hardware/Cargo.toml
            cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-document-parser/Cargo.toml
            cargo llvm-cov --no-report --manifest-path src-tauri/utils/Cargo.toml
            cargo llvm-cov report --lcov --output-path rust-lcov.info --manifest-path src-tauri/Cargo.toml
          } || {
            echo "::warning::Base branch Rust coverage failed; continuing without a Rust baseline."
            printf 'TN:\n' > rust-lcov.info
          }

      - name: Upload Rust code coverage for ref branch
        uses: actions/upload-artifact@v4
        with:
          name: ref-rust-lcov.info
          path: rust-lcov.info

  test-on-macos:
    needs: ci-scope
    runs-on: 'macos-latest'
    if: needs.ci-scope.outputs.full_ci == 'true'
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Linter and test
        run: |
          make test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  test-on-windows:
    needs: ci-scope
    if: needs.ci-scope.outputs.full_ci == 'true' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        antivirus-tools: ['mcafee', 'bit-defender']
    runs-on: windows-desktop-${{ matrix.antivirus-tools }}
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Clean cache, continue on error
      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\Biyan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        shell: powershell
        run: |
          make test

  test-on-windows-pr:
    needs: ci-scope
    if: needs.ci-scope.outputs.full_ci == 'true' && github.event_name != 'push'
    runs-on: 'windows-latest'
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install dependencies
        run: |
          choco install --yes --no-progress make

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\Biyan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Install WebView2 Runtime (Bootstrapper)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'setup.exe'
          Start-Process -FilePath setup.exe -Verb RunAs -Wait

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        shell: powershell
        run: |
          make test
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-on-ubuntu:
    needs: ci-scope
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'ubuntu-latest' }}
    if: needs.ci-scope.outputs.full_ci == 'true'
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 webkit2gtk-driver

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        run: |
          DISPLAY=$(w -h | awk 'NR==1 {print $2}')
          export DISPLAY
          echo -e "Display ID: $DISPLAY"
          make test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: electron/playwright-report/
          retention-days: 2

  coverage-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    needs: [ci-scope, base_branch_cov, base_branch_rust_cov]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run TypeScript test coverage
        run: |
          yarn test:coverage

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust test coverage
        run: ./scripts/rust-coverage.sh

      - name: Merge coverage reports
        run: |
          cat ./coverage/lcov.info rust-lcov.info > merged-lcov.info

      - name: Download code coverage report from base branch
        uses: actions/download-artifact@v4
        with:
          name: ref-lcov.info

      - name: Download Rust code coverage report from base branch
        id: download-rust-cov
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ref-rust-lcov.info
          path: base-rust-cov

      - name: Merge base branch coverage reports
        id: base-coverage
        run: |
          if [ ! -f ./lcov.info ] || ! grep -q '^SF:' ./lcov.info; then
            echo "::warning::Base TypeScript coverage is unavailable; skipping coverage delta report."
            printf 'TN:\n' > base-merged-lcov.info
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ -f ./base-rust-cov/rust-lcov.info ] && grep -q '^SF:' ./base-rust-cov/rust-lcov.info; then
            cat ./lcov.info ./base-rust-cov/rust-lcov.info > base-merged-lcov.info
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rust base coverage not available, using TS-only coverage"
            cp ./lcov.info base-merged-lcov.info
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Code Coverage report
        if: steps.base-coverage.outputs.available == 'true'
        id: code-coverage
        uses: barecheck/code-coverage-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: './merged-lcov.info'
          base-lcov-file: './base-merged-lcov.info'
          send-summary-comment: true
          show-annotations: 'warning'

  pr-ci-gate:
    name: PR CI Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - ci-scope
      - quick-pr-check
      - release-safety
      - test-on-macos
      - test-on-ubuntu
      - test-on-windows-pr
      - coverage-check
    steps:
      - name: Check required PR CI results
        shell: bash
        env:
          FULL_CI: ${{ needs.ci-scope.outputs.full_ci }}
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          FAST_RESULT: ${{ needs.quick-pr-check.result }}
          RELEASE_SAFETY_RESULT: ${{ needs.release-safety.result }}
          MACOS_RESULT: ${{ needs.test-on-macos.result }}
          UBUNTU_RESULT: ${{ needs.test-on-ubuntu.result }}
          WINDOWS_PR_RESULT: ${{ needs.test-on-windows-pr.result }}
          COVERAGE_RESULT: ${{ needs.coverage-check.result }}
        run: |
          set -euo pipefail

          failed=0

          require_success() {
            local name="$1"
            local result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::${name} must pass, got '${result:-missing}'."
              failed=1
            fi
          }

          require_success "Detect CI scope" "$SCOPE_RESULT"
          require_success "Fast PR check" "$FAST_RESULT"
          require_success "Release safety policy" "$RELEASE_SAFETY_RESULT"

          if [ "$FULL_CI" = "true" ]; then
            require_success "test-on-macos" "$MACOS_RESULT"
            require_success "test-on-ubuntu" "$UBUNTU_RESULT"
            require_success "test-on-windows-pr" "$WINDOWS_PR_RESULT"
            require_success "coverage-check" "$COVERAGE_RESULT"
          else
            echo "full_ci=false; full platform jobs are not required for this PR."
          fi

          exit "$failed"
