name: Biyan Linter & Test
on:
  workflow_dispatch:
  schedule:
    # Nightly full CI at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  push:
    branches:
      - mita-main
      - release/**
    paths:
      - '.github/workflows/biyan-linter-and-test.yml'
      - 'web/**'
      - 'joi/**'
      - 'package.json'
      - 'node_modules/**'
      - 'yarn.lock'
      - 'core/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'src-tauri/**'
      - 'web-app/**'
      - '!README.md'
      - 'Makefile'

  pull_request:
    branches:
      - mita-main
      - release/**
    # No paths filter on purpose: the workflow must run on EVERY PR so the
    # required "PR CI Gate" check always reports. With a paths filter a
    # focused PR can leave the gate perpetually "expected" and un-mergeable.
    # Cost is controlled by the trusted-base impact plan below.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-scope:
    name: Detect CI scope
    runs-on: ubuntu-24.04
    outputs:
      full_ci: ${{ steps.scope.outputs.full }}
      run_checks: ${{ steps.scope.outputs.quick }}
      docs: ${{ steps.scope.outputs.docs }}
      checkpoint: ${{ steps.scope.outputs.checkpoint }}
      policy: ${{ steps.scope.outputs.policy }}
      updater: ${{ steps.scope.outputs.updater }}
      artifact_replay: ${{ steps.scope.outputs.artifact_replay }}
      test_macos: ${{ steps.scope.outputs.test_macos }}
      test_windows: ${{ steps.scope.outputs.test_windows }}
      test_linux: ${{ steps.scope.outputs.test_linux }}
      build_macos: ${{ steps.scope.outputs.build_macos }}
      build_windows: ${{ steps.scope.outputs.build_windows }}
      build_linux: ${{ steps.scope.outputs.build_linux }}
      plan_sha256: ${{ steps.scope.outputs.plan_sha256 }}
      classification_json: ${{ steps.scope.outputs.classification_json }}
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          emit_bootstrap_full() {
            local plan
            local plan_sha
            plan='{"classification":"bootstrap-full","reason":"trusted classifier is not available on the base commit"}'
            plan_sha="$(printf '%s' "$plan" | sha256sum | awk '{print $1}')"
            {
              echo 'classification=bootstrap-full'
              echo 'blocked=false'
              echo 'docs=true'
              echo 'checkpoint=false'
              echo 'focused=true'
              echo 'quick=true'
              echo 'policy=true'
              echo 'updater=true'
              echo 'artifact_replay=false'
              echo 'test_macos=true'
              echo 'test_windows=true'
              echo 'test_linux=true'
              echo 'build_macos=true'
              echo 'build_windows=true'
              echo 'build_linux=true'
              echo 'full=true'
              echo "plan_sha256=$plan_sha"
              echo "classification_json=$plan"
            } >> "$GITHUB_OUTPUT"
          }

          event='${{ github.event_name }}'
          if [ "$event" = 'pull_request' ]; then
            policy_sha='${{ github.event.pull_request.base.sha }}'
            target_sha='${{ github.event.pull_request.head.sha }}'
            # A missing/disconnected object must upgrade the plan to the
            # fail-closed bootstrap-full path instead of aborting under -e.
            base_sha="$(git merge-base "$policy_sha" "$target_sha" || true)"
          elif [ "$event" = 'push' ]; then
            policy_sha='${{ github.event.before }}'
            target_sha='${{ github.sha }}'
            base_sha="$policy_sha"
          else
            emit_bootstrap_full
            exit 0
          fi

          if [[ ! "$policy_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$policy_sha" =~ ^0{40}$ ]]; then
            emit_bootstrap_full
            exit 0
          fi

          classifier="$RUNNER_TEMP/qualification-impact.mjs"
          if ! git show "${policy_sha}:scripts/ci/qualification-impact.mjs" > "$classifier"; then
            emit_bootstrap_full
            exit 0
          fi

          # Run policy from the immutable base commit. A PR cannot weaken its
          # own scope, and a classifier change is classified as full by the
          # preceding trusted version.
          node "$classifier" classify \
            --repo "$GITHUB_WORKSPACE" \
            --base "$base_sha" \
            --target "$target_sha" \
            --format github-output >> "$GITHUB_OUTPUT"

      - name: Validate CI scope outputs
        shell: bash
        env:
          CLASSIFICATION: ${{ steps.scope.outputs.classification }}
          BLOCKED: ${{ steps.scope.outputs.blocked }}
          DOCS: ${{ steps.scope.outputs.docs }}
          CHECKPOINT: ${{ steps.scope.outputs.checkpoint }}
          FOCUSED: ${{ steps.scope.outputs.focused }}
          QUICK: ${{ steps.scope.outputs.quick }}
          POLICY: ${{ steps.scope.outputs.policy }}
          UPDATER: ${{ steps.scope.outputs.updater }}
          ARTIFACT_REPLAY: ${{ steps.scope.outputs.artifact_replay }}
          TEST_MACOS: ${{ steps.scope.outputs.test_macos }}
          TEST_WINDOWS: ${{ steps.scope.outputs.test_windows }}
          TEST_LINUX: ${{ steps.scope.outputs.test_linux }}
          BUILD_MACOS: ${{ steps.scope.outputs.build_macos }}
          BUILD_WINDOWS: ${{ steps.scope.outputs.build_windows }}
          BUILD_LINUX: ${{ steps.scope.outputs.build_linux }}
          FULL: ${{ steps.scope.outputs.full }}
          PLAN_SHA256: ${{ steps.scope.outputs.plan_sha256 }}
          CLASSIFICATION_JSON: ${{ steps.scope.outputs.classification_json }}
        run: |
          set -euo pipefail

          for entry in \
            "docs=$DOCS" \
            "checkpoint=$CHECKPOINT" \
            "focused=$FOCUSED" \
            "quick=$QUICK" \
            "policy=$POLICY" \
            "updater=$UPDATER" \
            "artifact_replay=$ARTIFACT_REPLAY" \
            "test_macos=$TEST_MACOS" \
            "test_windows=$TEST_WINDOWS" \
            "test_linux=$TEST_LINUX" \
            "build_macos=$BUILD_MACOS" \
            "build_windows=$BUILD_WINDOWS" \
            "build_linux=$BUILD_LINUX" \
            "full=$FULL"; do
            name="${entry%%=*}"
            value="${entry#*=}"
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::error::Classifier output '$name' is not boolean: ${value:-missing}"
              exit 1
            fi
          done
          if [ -z "$CLASSIFICATION" ]; then
            echo "::error::Classifier output 'classification' is missing"
            exit 1
          fi
          if [ "$BLOCKED" != "false" ]; then
            echo "::error::Classifier blocked the PR scope: ${BLOCKED:-missing}"
            exit 1
          fi
          if [[ ! "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Classifier plan_sha256 is invalid"
            exit 1
          fi
          node - "$CLASSIFICATION_JSON" "$PLAN_SHA256" "$CLASSIFICATION" <<'NODE'
          const [raw, planSha256, classification] = process.argv.slice(2)
          const plan = JSON.parse(raw)
          if (!plan || Array.isArray(plan) || typeof plan !== 'object') {
            throw new Error('classification_json must be an object')
          }
          if (plan.classification !== classification) {
            throw new Error('classification_json identity mismatch')
          }
          if (plan.planSha256 !== undefined && plan.planSha256 !== planSha256) {
            throw new Error('classification_json plan hash mismatch')
          }
          if (plan.blocked === true) {
            throw new Error('classification_json is blocked')
          }
          NODE

  quick-pr-check:
    name: Fast PR check
    needs: ci-scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Focused policy/checkpoint/docs changes are handled by their dedicated
      # gates and report success here without allocating a web build.
      - name: Skip broad web checks (focused change)
        if: needs.ci-scope.outputs.run_checks != 'true'
        run: echo "The trusted impact plan does not require broad web checks."

      - name: Getting the repo
        if: needs.ci-scope.outputs.run_checks == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installing node
        if: needs.ci-scope.outputs.run_checks == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Config Yarn
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn install

      - name: Lint web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn lint

      - name: Test web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn test:web

      - name: Build web app
        if: needs.ci-scope.outputs.run_checks == 'true'
        run: yarn build:web

  release-safety:
    name: Release safety policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file) }' \
            .github/workflows/*.yml .github/workflows/*.yaml

      - name: Exercise locked candidate signer install
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable --mode=skip-build
          signer_probe="$RUNNER_TEMP/tauri-signer-probe"
          install -d -m 700 "$signer_probe"
          printf 'biyan signer preflight\n' >"$signer_probe/payload.txt"
          yarn tauri signer generate \
            --ci \
            --password preflight-only \
            --write-keys "$signer_probe/test.key"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$signer_probe/test.key" \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=preflight-only \
            yarn tauri signer sign "$signer_probe/payload.txt"
          test -s "$signer_probe/payload.txt.sig"

      - name: Verify private packages, signing keys, egress, and artifact policy
        run: node scripts/ci/verify-release-policy.mjs

      - name: Test release gate policy contracts
        run: |
          node --test scripts/ci/__tests__/candidate-content-policy.test.mjs
          node --test scripts/ci/__tests__/cloudflare-preview-cleanup.test.mjs
          node --test scripts/ci/__tests__/legacy-compatibility-policy.test.mjs
          node --test scripts/ci/__tests__/release-policy.test.mjs
          python3 scripts/ci/__tests__/extract-release-candidate-recovery.test.py
          node --test scripts/ci/__tests__/verify-release-candidate-recovery.test.mjs
          node --test scripts/ci/__tests__/verify-release-target.test.mjs

      - name: Test updater candidate, promotion, and routing contracts
        run: |
          node --test scripts/updater/__tests__/a-canary-evidence.test.mjs
          node --test scripts/updater/__tests__/legacy-manifest-policy.test.mjs
          node --test scripts/updater/__tests__/legacy-pause-transaction.test.mjs
          node --test scripts/updater/__tests__/promotion-transaction.test.mjs
          node --test scripts/updater/__tests__/updater.test.mjs
          python3 -m unittest \
            autoqa/tests/test_migration_runner.py \
            scripts/updater/__tests__/test_prepare_a_canary_inputs.py

      - name: Test scoped qualification contracts
        run: |
          node --test scripts/ci/__tests__/qualification-impact.test.mjs
          node --test scripts/ci/__tests__/run-untrusted-qualification-verifier.test.mjs
          node --test scripts/ci/__tests__/verify-qualification-artifacts.test.mjs
          node --test scripts/ci/__tests__/verify-qualification-recovery.test.mjs
          node --test scripts/release-distribution/__tests__/bootstrap-biyan-download-aliases.test.mjs
          node --test scripts/release-distribution/__tests__/release-distribution.test.mjs

      - name: Exercise unprivileged qualification verifier boundary
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$GITHUB_WORKSPACE/qualification-helper-smoke"
          verifier="$RUNNER_TEMP/qualification-helper-smoke.mjs"
          rm -rf "$probe_root"
          trap 'rm -rf "$probe_root" "$verifier"' EXIT
          mkdir -p "$probe_root"
          printf 'sandbox-readable\n' > "$probe_root/marker.txt"
          cat > "$verifier" <<'NODE'
          import fs from 'node:fs'
          const marker = process.argv[2]
          if (fs.readFileSync(marker, 'utf8') !== 'sandbox-readable\n') {
            throw new Error('unprivileged verifier could not read exact marker')
          }
          NODE
          chmod 0644 "$verifier"
          scripts/ci/run-untrusted-qualification-verifier.sh \
            --read-root "$probe_root" "$verifier" "$probe_root/marker.txt"

  base_branch_cov:
    needs: ci-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run test coverage
        run: |
          yarn test:coverage || {
            echo "::warning::Base branch TypeScript coverage failed; continuing without a TS baseline."
            mkdir -p coverage
            printf 'TN:\n' > coverage/lcov.info
          }

      - name: Upload code coverage for ref branch
        uses: actions/upload-artifact@v4
        with:
          name: ref-lcov.info
          path: coverage/lcov.info

  base_branch_rust_cov:
    needs: ci-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Create Tauri resource stubs for CI
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          mkdir -p src-tauri/resources/bin src-tauri/resources/pre-install src-tauri/icons
          mkdir -p src-tauri/resources/ms-playwright
          mkdir -p src-tauri/resources/node_modules/playwright src-tauri/resources/node_modules/playwright-core
          mkdir -p src-tauri/resources/computer-agent-runner
          touch src-tauri/resources/pre-install/.gitkeep
          touch src-tauri/resources/ms-playwright/.gitkeep
          touch src-tauri/resources/node_modules/playwright/.gitkeep
          touch src-tauri/resources/node_modules/playwright-core/.gitkeep
          touch src-tauri/resources/computer-agent-runner/.gitkeep
          touch src-tauri/resources/LICENSE
          touch src-tauri/resources/NOTICE
          touch src-tauri/resources/bin/biyan-cli
          touch src-tauri/resources/bin/biyan-web-research-mcp.mjs
          chmod +x src-tauri/resources/bin/biyan-cli src-tauri/resources/bin/biyan-web-research-mcp.mjs
          for bin in uv bun; do
            touch "src-tauri/resources/bin/${bin}-${TRIPLE}"
            chmod +x "src-tauri/resources/bin/${bin}-${TRIPLE}"
          done
          # Icons are gitignored; generate_context!() requires them at compile time
          for icon in 32x32.png 128x128.png 128x128@2x.png icon.icns icon.ico; do
            [ -f "src-tauri/icons/$icon" ] || cp src-tauri/icons/icon.png "src-tauri/icons/$icon"
          done

      - name: Run Rust test coverage
        run: |
          cargo llvm-cov clean --workspace --manifest-path src-tauri/Cargo.toml
          {
            cargo llvm-cov --no-report --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- --test-threads=1
            cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-hardware/Cargo.toml
            cargo llvm-cov --no-report --manifest-path src-tauri/plugins/tauri-plugin-document-parser/Cargo.toml
            cargo llvm-cov --no-report --manifest-path src-tauri/utils/Cargo.toml
            cargo llvm-cov report --lcov --output-path rust-lcov.info --manifest-path src-tauri/Cargo.toml
          } || {
            echo "::warning::Base branch Rust coverage failed; continuing without a Rust baseline."
            printf 'TN:\n' > rust-lcov.info
          }

      - name: Upload Rust code coverage for ref branch
        uses: actions/upload-artifact@v4
        with:
          name: ref-rust-lcov.info
          path: rust-lcov.info

  test-on-macos:
    needs: ci-scope
    runs-on: macos-15-intel
    if: needs.ci-scope.outputs.test_macos == 'true'
    timeout-minutes: 90
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Verify native x86_64 runner
        run: |
          test "$(uname -m)" = 'x86_64'
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Linter and test
        run: |
          make test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  test-on-windows:
    needs: ci-scope
    if: needs.ci-scope.outputs.test_windows == 'true' && github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: choco install --yes --no-progress make

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify native x86_64 runner
        shell: powershell
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

      # Clean cache, continue on error
      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\Biyan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        shell: powershell
        run: |
          make test

  test-on-windows-pr:
    needs: ci-scope
    if: needs.ci-scope.outputs.test_windows == 'true' && github.event_name != 'push'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install dependencies
        run: |
          choco install --yes --no-progress make

      - name: Verify native x86_64 runner
        shell: powershell
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\Biyan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Install WebView2 Runtime (Bootstrapper)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'setup.exe'
          Start-Process -FilePath setup.exe -Verb RunAs -Wait

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        shell: powershell
        run: |
          make test
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Reclaim Windows test-only build space
        if: needs.ci-scope.outputs.build_windows == 'true'
        shell: pwsh
        run: |
          $remove = @(
            'coverage',
            'core/coverage',
            'web-app/coverage',
            'electron/playwright-report',
            'src-tauri/target/debug'
          )
          if (Test-Path 'src-tauri/target') {
            Get-ChildItem 'src-tauri/target' -Directory | ForEach-Object {
              $remove += (Join-Path $_.FullName 'debug')
            }
            Get-ChildItem 'src-tauri/target' -Directory -Recurse `
              -Filter incremental -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          foreach ($path in $remove) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-PSDrive -Name C | Format-Table -AutoSize

      - name: Build focused unsigned Windows candidate
        if: needs.ci-scope.outputs.build_windows == 'true'
        shell: pwsh
        run: |
          $releaseMetadata = Get-Content biyan-release.json -Raw |
            ConvertFrom-Json
          $env:BIYAN_DATA_SCHEMA = [string]$releaseMetadata.dataSchema
          $version = (
            Get-Content src-tauri/tauri.conf.json -Raw |
              ConvertFrom-Json
          ).version
          & node scripts/release-version.mjs stamp $version --windows
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows release stamp failed'
          }
          $tauriConfigPath = 'src-tauri/tauri.conf.json'
          $tauriConfig = Get-Content $tauriConfigPath -Raw |
            ConvertFrom-Json
          $tauriConfig.bundle.createUpdaterArtifacts = $false
          $tauriConfig | ConvertTo-Json -Depth 100 |
            Set-Content $tauriConfigPath -Encoding utf8NoBOM
          $unsignedConfig = Get-Content $tauriConfigPath -Raw |
            ConvertFrom-Json
          if ($unsignedConfig.bundle.createUpdaterArtifacts -ne $false) {
            throw 'Focused PR candidate must disable updater artifacts'
          }
          make build

      - name: Verify focused unsigned Windows candidate
        if: needs.ci-scope.outputs.build_windows == 'true'
        shell: pwsh
        run: |
          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw |
            ConvertFrom-Json
          $version = [string]$tauriConfig.version
          $bundle = 'src-tauri/target/release/bundle'
          $exe = "$bundle/nsis/Biyan_$version`_x64-setup.exe"
          $msi = "$bundle/msi/Biyan_$version`_x64_en-US.msi"
          & ./scripts/ci/verify-windows-candidate.ps1 `
            -Exe $exe `
            -Msi $msi `
            -Version $version `
            -GeneratedNsis 'src-tauri/target/release/nsis/x64/installer.nsi'
          node ./scripts/ci/candidate-path-policy.mjs --root $bundle

  test-on-ubuntu:
    needs: ci-scope
    runs-on: ubuntu-24.04
    if: needs.ci-scope.outputs.test_linux == 'true'
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify native x86_64 runner
        run: test "$(uname -m)" = 'x86_64'

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 webkit2gtk-driver

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Linter and test
        run: |
          DISPLAY=$(w -h | awk 'NR==1 {print $2}')
          export DISPLAY
          echo -e "Display ID: $DISPLAY"
          make test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: electron/playwright-report/
          retention-days: 2

  coverage-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.ci-scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    needs: [ci-scope, base_branch_cov, base_branch_rust_cov]
    permissions:
      contents: read
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/biyan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies
        run: |
          make lint

      - name: Run TypeScript test coverage
        run: |
          yarn test:coverage

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust test coverage
        run: ./scripts/rust-coverage.sh

      - name: Merge coverage reports
        run: |
          cat ./coverage/lcov.info rust-lcov.info > merged-lcov.info

      - name: Download code coverage report from base branch
        uses: actions/download-artifact@v4
        with:
          name: ref-lcov.info

      - name: Download Rust code coverage report from base branch
        id: download-rust-cov
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ref-rust-lcov.info
          path: base-rust-cov

      - name: Merge base branch coverage reports
        id: base-coverage
        run: |
          if [ ! -f ./lcov.info ] || ! grep -q '^SF:' ./lcov.info; then
            echo "::warning::Base TypeScript coverage is unavailable; skipping coverage delta report."
            printf 'TN:\n' > base-merged-lcov.info
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ -f ./base-rust-cov/rust-lcov.info ] && grep -q '^SF:' ./base-rust-cov/rust-lcov.info; then
            cat ./lcov.info ./base-rust-cov/rust-lcov.info > base-merged-lcov.info
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rust base coverage not available, using TS-only coverage"
            cp ./lcov.info base-merged-lcov.info
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record coverage evidence without repository writes
        if: steps.base-coverage.outputs.available == 'true'
        run: |
          test -s merged-lcov.info
          test -s base-merged-lcov.info
          {
            echo '## Coverage evidence'
            echo
            echo 'Target and base LCOV reports were generated successfully.'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-ci-gate:
    name: PR CI Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - ci-scope
      - quick-pr-check
      - release-safety
      - test-on-macos
      - test-on-ubuntu
      - test-on-windows-pr
      - coverage-check
    steps:
      - name: Check required PR CI results
        shell: bash
        env:
          FULL_CI: ${{ needs.ci-scope.outputs.full_ci }}
          TEST_MACOS: ${{ needs.ci-scope.outputs.test_macos }}
          TEST_LINUX: ${{ needs.ci-scope.outputs.test_linux }}
          TEST_WINDOWS: ${{ needs.ci-scope.outputs.test_windows }}
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          FAST_RESULT: ${{ needs.quick-pr-check.result }}
          RELEASE_SAFETY_RESULT: ${{ needs.release-safety.result }}
          MACOS_RESULT: ${{ needs.test-on-macos.result }}
          UBUNTU_RESULT: ${{ needs.test-on-ubuntu.result }}
          WINDOWS_PR_RESULT: ${{ needs.test-on-windows-pr.result }}
          COVERAGE_RESULT: ${{ needs.coverage-check.result }}
        run: |
          set -euo pipefail

          failed=0

          require_success() {
            local name="$1"
            local result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::${name} must pass, got '${result:-missing}'."
              failed=1
            fi
          }

          require_success "Detect CI scope" "$SCOPE_RESULT"
          require_success "Fast PR check" "$FAST_RESULT"
          require_success "Release safety policy" "$RELEASE_SAFETY_RESULT"

          if [ "$TEST_MACOS" = "true" ]; then
            require_success "test-on-macos" "$MACOS_RESULT"
          fi
          if [ "$TEST_LINUX" = "true" ]; then
            require_success "test-on-ubuntu" "$UBUNTU_RESULT"
          fi
          if [ "$TEST_WINDOWS" = "true" ]; then
            require_success "test-on-windows-pr" "$WINDOWS_PR_RESULT"
          fi
          if [ "$FULL_CI" = "true" ]; then
            require_success "coverage-check" "$COVERAGE_RESULT"
          fi

          echo "Scoped CI plan enforced (full_ci=$FULL_CI)."

          exit "$failed"
