name: "Auto Label Conventional Commits"
on:
  pull_request:
    types:
      - reopened
      - opened
      - synchronize
jobs:
  label_prs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Label PRs
        run: |
          ISSUE_TITLE=$(gh issue view ${{ github.event.number }} --json title -q ".title")
          case "$ISSUE_TITLE" in
            feat:*) LABEL="enhancement" ;;
            perf:*) LABEL="enhancement" ;;
            fix:*) LABEL="bug" ;;
            docs:*) LABEL="documentation" ;;
            ci:*) LABEL="enhancement" ;;
            build:*) LABEL="enhancement" ;;
            refactor:*) LABEL="enhancement" ;;
            *) LABEL="" ;;
          esac
          if [ -n "$LABEL" ]; then
            gh issue edit ${{ github.event.number }} --add-label "$LABEL" || echo "::warning::Could not add label '$LABEL'."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
