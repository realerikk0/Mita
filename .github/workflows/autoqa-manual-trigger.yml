name: Manual trigger AutoQA Test Runner

on:
  workflow_dispatch:
    inputs:
      mita_app_url_windows:
        description: 'URL to download Mita app for Windows (.exe)'
        required: true
        type: string
        default: 'https://updates.jingxing.uk/mita/nightly/Mita-nightly_0.6.5-758_x64-setup.exe'
      mita_app_url_ubuntu:
        description: 'URL to download Mita app for Ubuntu (.deb)'
        required: true
        type: string
        default: 'https://updates.jingxing.uk/mita/nightly/Mita-nightly_0.6.5-758_amd64.deb'
      mita_app_url_macos:
        description: 'URL to download Mita app for macOS (.dmg)'
        required: true
        type: string
        default: 'https://updates.jingxing.uk/mita/nightly/Mita-nightly_0.6.5-758_universal.dmg'
      is_nightly:
        description: 'Is this a nightly build?'
        required: true
        type: boolean
        default: true

jobs:
  call-autoqa-template:
    uses: ./.github/workflows/autoqa-template.yml
    with:
      mita_app_windows_source: ${{ inputs.mita_app_url_windows }}
      mita_app_ubuntu_source: ${{ inputs.mita_app_url_ubuntu }}
      mita_app_macos_source: ${{ inputs.mita_app_url_macos }}
      is_nightly: ${{ inputs.is_nightly }}
      source_type: 'url'
    secrets:
      RP_TOKEN: ${{ secrets.RP_TOKEN }}
